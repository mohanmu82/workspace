spring.application.name=taskmanagement
server.port=8443

# Plain-HTTP port. Nothing is served here directly - HttpsRedirectConfig adds a
# second connector on this port that 301-redirects every request to server.port over HTTPS.
server.http.port=8080

# -----------------------------------------------------------------------
# HTTPS
#   Self-signed dev certificate at src/main/resources/keystore.p12 (CN=localhost).
#   Replace the keystore and set SSL_KEYSTORE_PASSWORD for real deployments -
#   browsers will flag the self-signed cert as untrusted.
# -----------------------------------------------------------------------
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=taskmanagement

# Actuator shares the app's HTTPS port (8443) — keep exposure limited to what's needed
# for health checks and metrics scraping/pushing.
management.endpoints.web.exposure.include=health,prometheus

# Push JVM/app metrics to a shared Prometheus Pushgateway — set address to the real
# gateway host:port in every environment.
management.prometheus.metrics.export.pushgateway.enabled=true
management.prometheus.metrics.export.pushgateway.address=localhost:9091
management.prometheus.metrics.export.pushgateway.job=taskmanagement
management.prometheus.metrics.export.pushgateway.push-rate=1m
management.prometheus.metrics.export.pushgateway.shutdown-operation=post

spring.profiles.default=json

# -----------------------------------------------------------------------
# Datasource selection
#   (no profile)  = PostgreSQL via JPA  [default]
#   oracle        = Oracle via JPA       set: spring.profiles.active=oracle
#   json          = JSON files on disk   set: spring.profiles.active=json
# -----------------------------------------------------------------------

spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanagement
spring.datasource.username=taskuser
spring.datasource.password=taskpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Backup/restore uploads (Admin > Backup & Restore) can be sizeable once history/comments pile up
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Base directory: every projects/programmes/events/tasks/templates JSON store below is
# resolved under this single directory instead of being configured one-by-one.
app.data.base-directory=./data

# Field configuration: display names, types, defaults, dropdown sources
app.field-configs.file=${app.data.base-directory}/field-configs.json

# Project management: projects (one JSON file per project) and milestones (JSON-profile storage; ignored under JPA profiles)
app.projects.directory=${app.data.base-directory}/projects
app.milestones.file=${app.data.base-directory}/milestones.json

# Programme management: one JSON file per programme (JSON-profile storage; ignored under JPA profiles)
app.programmes.directory=${app.data.base-directory}/programmes

# Task templates: one JSON file per template (JSON-profile storage; ignored under JPA profiles)
app.task-templates.directory=${app.data.base-directory}/task-templates

# Calendar events: holidays, DR tests, change freezes, etc. (JSON-profile storage; ignored under JPA profiles)
app.events.directory=${app.data.base-directory}/events

# Notes: quick conversation notes, separate from tasks (JSON-profile storage; ignored under JPA profiles)
app.notes.directory=${app.data.base-directory}/notes

# User access grants: who may use the app and at what permission level (JSON-profile storage; ignored under JPA profiles)
app.user-access.file=${app.data.base-directory}/user-access.json

# Admin-defined list of extra user-info attributes (firstName, nickname, orgUnit, team, ...) and
# the JSONPath used to pull each one out of the auth.user-detail-url response. Always a plain
# JSON file, regardless of the active storage profile - see Admin > Access > Attributes.
app.user-info-config.file=${app.data.base-directory}/user-info-config.json

# -----------------------------------------------------------------------
# Authentication / SSO
#   When disabled (default) every page and API call is open - no login redirect,
#   no permission checks. Useful for local dev. Flip to true once jwt-url, jwk-url
#   and key-id are configured for the real IdP.
# -----------------------------------------------------------------------
auth.enabled=false

# Standard URL the browser is redirected to for authentication. Must accept a
# redirect-uri param (name configurable below) and, once the user is authenticated
# via their browser session/credentials, send the browser back to that URL with a
# JWT appended as a query param (name also configurable below).
auth.jwt-url=https://sso.example.com/oauth2/authorize

# Query param this app's own return URL is passed under when redirecting to jwt-url
auth.redirect-param=redirect_uri

# Query param the IdP appends the JWT under when it redirects back to this app
auth.token-param=token

# URL of the IdP's JWKS document (JSON Web Key Set) used to verify the JWT's RS256
# signature. Fetched once at startup and cached - restart the app to pick up a
# rotated key.
auth.jwk-url=https://sso.example.com/.well-known/jwks.json

# The "kid" (key id) of the RSA key within the JWKS document to use for verification.
# Tokens whose header "kid" doesn't match this value are rejected.
auth.key-id=change-me-to-the-idp-key-id

# Name of the JWT claim that carries the user's unique userid (BRID). This value is
# used as the userid throughout the app - matched against auth.admin-userids and
# against the access grants in the Admin > Access tab.
auth.brid-claim=BRID

# HTTP GET URL used to look up a user's info when an admin adds them by BRID in Admin > Access.
# The literal "{brid}" placeholder is replaced with the BRID being added. Called once at add
# time (not on every login) - each configured attribute's JSONPath (see Admin > Access >
# Attributes / app.user-info-config.file) is applied to the JSON response to prefill that
# user's row, which can then be edited by hand before saving.
auth.user-detail-url=https://userdirectory.example.com/api/users?brid={brid}

# Userids (the JWT "BRID" claim, see auth.brid-claim) granted admin access - can see the
# Admin > Access tab and manage other users' permissions, regardless of their own
# access-grant record.
auth.admin-userids=
