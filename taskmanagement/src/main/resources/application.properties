spring.application.name=taskmanagement
server.port=8080

# Actuator shares the app's port (8080) — keep exposure limited to what's needed
# for health checks and metrics scraping/pushing.
management.endpoints.web.exposure.include=health,prometheus

# Push JVM/app metrics to a shared Prometheus Pushgateway — set address to the real
# gateway host:port in every environment.
management.prometheus.metrics.export.pushgateway.enabled=true
management.prometheus.metrics.export.pushgateway.address=localhost:9091
management.prometheus.metrics.export.pushgateway.job=taskmanagement
management.prometheus.metrics.export.pushgateway.push-rate=1m
management.prometheus.metrics.export.pushgateway.shutdown-operation=post

spring.profiles.default=json

# -----------------------------------------------------------------------
# Datasource selection
#   (no profile)  = PostgreSQL via JPA  [default]
#   oracle        = Oracle via JPA       set: spring.profiles.active=oracle
#   json          = JSON files on disk   set: spring.profiles.active=json
# -----------------------------------------------------------------------

spring.datasource.url=jdbc:postgresql://localhost:5432/taskmanagement
spring.datasource.username=taskuser
spring.datasource.password=taskpass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# Field configuration: display names, types, defaults, dropdown sources
app.field-configs.file=./data/field-configs.json

# Project management: projects (one JSON file per project) and milestones (JSON-profile storage; ignored under JPA profiles)
app.projects.directory=./data/projects
app.milestones.file=./data/milestones.json

# Programme management: one JSON file per programme (JSON-profile storage; ignored under JPA profiles)
app.programmes.directory=./data/programmes

# Task templates: one JSON file per template (JSON-profile storage; ignored under JPA profiles)
app.task-templates.directory=./data/task-templates
