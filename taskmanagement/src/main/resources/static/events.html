<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Events</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="theme.css"/>
  <style>
    body { background: #f4f6f9; font-size: 0.875rem; }
    .cal-wrap { display: flex; gap: 1rem; align-items: flex-start; }
    .upcoming-panel { width: 280px; flex-shrink: 0; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 0.75rem; max-height: calc(100vh - 170px); overflow-y: auto; }
    .cal-main { flex: 1; min-width: 0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-dow { text-align: center; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; color: #6c757d; padding-bottom: 4px; }
    .cal-cell { background: #fff; border: 1px solid #dee2e6; border-radius: 6px; min-height: 100px; padding: 4px; display: flex; flex-direction: column; }
    .cal-cell.other-month { background: #f4f6f9; color: #adb5bd; }
    .cal-cell.is-today { border-color: #0d6efd; box-shadow: inset 0 0 0 1px #0d6efd; }
    .cal-date-num { font-size: 0.75rem; font-weight: 600; margin-bottom: 2px; }
    .cal-cell.is-today .cal-date-num { color: #0d6efd; }
    .cal-events { flex: 1; overflow-y: auto; max-height: 110px; }
    .event-chip { border-radius: 4px; padding: 2px 5px; margin-bottom: 3px; font-size: 0.68rem; cursor: pointer; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .event-chip:hover { opacity: 0.85; }
    .upcoming-item { border-left: 4px solid #0dcaf0; background: #f8f9fa; border-radius: 4px; padding: 0.4rem 0.5rem; margin-bottom: 0.4rem; cursor: pointer; font-size: 0.78rem; }
    .upcoming-item:hover { background: #e9ecef; }
    .type-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
    #noUpcoming { display: none; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-check2-square me-2"></i>Task Manager</a>
  <div class="d-flex gap-2 align-items-center">
    <span class="text-light">Events</span>
    <a href="task-form.html" class="btn btn-success btn-sm"><i class="bi bi-plus-lg me-1"></i>New Task</a>
    <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-table me-1"></i>All Tasks</a>
    <a href="calendar.html" class="btn btn-outline-light btn-sm"><i class="bi bi-calendar3 me-1"></i>By Date</a>
    <a href="due-dates.html" class="btn btn-outline-light btn-sm"><i class="bi bi-list-ul me-1"></i>Due Dates List</a>
    <a href="projects.html" class="btn btn-outline-light btn-sm"><i class="bi bi-diagram-3 me-1"></i>Projects</a>
    <a href="programmes.html" class="btn btn-outline-light btn-sm"><i class="bi bi-diagram-2 me-1"></i>Programmes</a>
    <a href="phases.html" class="btn btn-outline-light btn-sm"><i class="bi bi-kanban me-1"></i>Phases</a>
    <a href="timeline.html" class="btn btn-outline-light btn-sm"><i class="bi bi-bar-chart-steps me-1"></i>Timeline</a>
    <a href="dependencies.html" class="btn btn-outline-light btn-sm"><i class="bi bi-link-45deg me-1"></i>Dependencies</a>
    <a href="admin.html" class="btn btn-outline-light btn-sm"><i class="bi bi-gear me-1"></i>Admin</a>
    <a href="api-docs.html" class="btn btn-outline-light btn-sm"><i class="bi bi-code-slash me-1"></i>API Docs</a>
    <button class="btn btn-outline-light btn-sm" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle dark mode"><i class="bi bi-moon-stars" id="themeIcon"></i></button>
  </div>
</nav>

<div class="container-fluid p-3">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-secondary btn-sm" onclick="shiftMonth(-1)"><i class="bi bi-chevron-left"></i></button>
      <h5 class="mb-0" id="monthLabel" style="min-width:170px"></h5>
      <button class="btn btn-outline-secondary btn-sm" onclick="shiftMonth(1)"><i class="bi bi-chevron-right"></i></button>
      <button class="btn btn-outline-primary btn-sm" onclick="goToday()">Today</button>
    </div>
    <button class="btn btn-primary btn-sm" onclick="openEventModal()"><i class="bi bi-plus-lg me-1"></i>New Event</button>
  </div>

  <div id="loadingIndicator" class="text-center py-4 text-muted" style="display:none"><div class="spinner-border spinner-border-sm"></div> Loading...</div>

  <div class="cal-wrap">
    <div class="cal-main">
      <div class="cal-grid mb-1" id="calHeader"></div>
      <div class="cal-grid" id="calGrid"></div>
    </div>

    <div class="upcoming-panel">
      <div class="fw-semibold small text-uppercase text-muted mb-2"><i class="bi bi-calendar-event me-1"></i>Upcoming Events</div>
      <div id="noUpcoming" class="text-muted small">No upcoming events</div>
      <div id="upcomingList"></div>
    </div>
  </div>

</div>

<!-- Add / edit event modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title" id="eventModalTitle"><i class="bi bi-calendar-event me-1"></i>New Event</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="eventId"/>
        <div class="mb-2">
          <label class="form-label small fw-semibold mb-1">Title</label>
          <input type="text" id="eventTitle" class="form-control form-control-sm"/>
        </div>
        <div class="mb-2">
          <label class="form-label small fw-semibold mb-1">Type</label>
          <select id="eventType" class="form-select form-select-sm"></select>
        </div>
        <div class="row g-2 mb-2">
          <div class="col">
            <label class="form-label small fw-semibold mb-1">Start Date</label>
            <input type="date" id="eventStartDate" class="form-control form-control-sm"/>
          </div>
          <div class="col">
            <label class="form-label small fw-semibold mb-1">End Date <span class="text-muted fw-normal">(optional)</span></label>
            <input type="date" id="eventEndDate" class="form-control form-control-sm"/>
          </div>
        </div>
        <div class="mb-1">
          <label class="form-label small fw-semibold mb-1">Description</label>
          <textarea id="eventDescription" class="form-control form-control-sm" rows="3"></textarea>
        </div>
        <div id="eventError" class="text-danger small mt-1" style="display:none"></div>
      </div>
      <div class="modal-footer py-2">
        <button class="btn btn-outline-danger btn-sm me-auto" id="deleteEventBtn" style="display:none" onclick="deleteEvent()"><i class="bi bi-trash me-1"></i>Delete</button>
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="saveEvent()">Save</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="theme.js"></script>
<script src="events.js"></script>
<script>
let allEvents = [];
let viewYear, viewMonth; // viewMonth is 0-based
let eventModal;
const today = new Date();
today.setHours(0, 0, 0, 0);

const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function init() {
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();
  eventModal = new bootstrap.Modal(document.getElementById('eventModal'));
  populateTypeSelect();
  loadEvents();
}

function populateTypeSelect() {
  const sel = document.getElementById('eventType');
  sel.innerHTML = EventTypes.all().map(t => `<option value="${t.id}">${esc(t.label)}</option>`).join('');
}

async function loadEvents() {
  document.getElementById('loadingIndicator').style.display = 'block';
  try {
    const res = await fetch('/api/events');
    allEvents = await res.json();
    render();
  } catch (e) {
    console.error(e);
  } finally {
    document.getElementById('loadingIndicator').style.display = 'none';
  }
}

function shiftMonth(delta) {
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
}

function goToday() {
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();
  render();
}

function dateKey(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function parseDateOnly(s) {
  // Interpret "YYYY-MM-DD" as a local date, avoiding UTC-shift issues with `new Date(s)`.
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function eventsForDate(d) {
  const key = dateKey(d);
  return allEvents.filter(e => {
    const start = e.startDate.substring(0, 10);
    const end = (e.endDate || e.startDate).substring(0, 10);
    return key >= start && key <= end;
  });
}

function render() {
  document.getElementById('monthLabel').textContent = `${MONTH_NAMES[viewMonth]} ${viewYear}`;

  const header = document.getElementById('calHeader');
  header.innerHTML = DOW_NAMES.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const firstOfMonth = new Date(viewYear, viewMonth, 1);
  const startDate = new Date(firstOfMonth);
  startDate.setDate(startDate.getDate() - startDate.getDay());
  const lastOfMonth = new Date(viewYear, viewMonth + 1, 0);
  const endDate = new Date(lastOfMonth);
  endDate.setDate(endDate.getDate() + (6 - endDate.getDay()));

  const grid = document.getElementById('calGrid');
  let html = '';
  const cursor = new Date(startDate);
  while (cursor <= endDate) {
    const otherMonth = cursor.getMonth() !== viewMonth;
    const isToday = cursor.getTime() === today.getTime();
    const dayEvents = eventsForDate(cursor);
    html += `<div class="cal-cell ${otherMonth ? 'other-month' : ''} ${isToday ? 'is-today' : ''}">
      <div class="cal-date-num">${cursor.getDate()}</div>
      <div class="cal-events">${dayEvents.map(e => eventChip(e)).join('')}</div>
    </div>`;
    cursor.setDate(cursor.getDate() + 1);
  }
  grid.innerHTML = html;

  renderUpcoming();
}

function eventChip(e) {
  return `<div class="event-chip" style="background:${EventTypes.color(e.type)}" onclick="openEventModal(${e.id})" title="${escAttr(e.title)} — ${escAttr(EventTypes.label(e.type))}">${esc(e.title)}</div>`;
}

function renderUpcoming() {
  const upcoming = allEvents
    .filter(e => (e.endDate || e.startDate).substring(0, 10) >= dateKey(today))
    .sort((a, b) => a.startDate.localeCompare(b.startDate))
    .slice(0, 25);
  document.getElementById('noUpcoming').style.display = upcoming.length === 0 ? 'block' : 'none';
  document.getElementById('upcomingList').innerHTML = upcoming.map(e => `
    <div class="upcoming-item" onclick="openEventModal(${e.id})">
      <span class="type-swatch" style="background:${EventTypes.color(e.type)}"></span><strong>${esc(e.title)}</strong>
      <div class="text-muted">${esc(EventTypes.label(e.type))} · ${formatRange(e)}</div>
    </div>`).join('');
}

function formatRange(e) {
  const start = parseDateOnly(e.startDate.substring(0, 10)).toLocaleDateString();
  if (!e.endDate || e.endDate.substring(0, 10) === e.startDate.substring(0, 10)) return start;
  return `${start} – ${parseDateOnly(e.endDate.substring(0, 10)).toLocaleDateString()}`;
}

// ── Add / edit / delete ─────────────────────────────────────────────────────
function openEventModal(id, dateKeyStr) {
  document.getElementById('eventError').style.display = 'none';
  document.getElementById('eventId').value = '';
  document.getElementById('eventTitle').value = '';
  document.getElementById('eventType').value = 'OTHER';
  document.getElementById('eventStartDate').value = dateKeyStr || dateKey(today);
  document.getElementById('eventEndDate').value = '';
  document.getElementById('eventDescription').value = '';
  document.getElementById('deleteEventBtn').style.display = 'none';
  document.getElementById('eventModalTitle').innerHTML = '<i class="bi bi-calendar-event me-1"></i>New Event';

  if (id) {
    const e = allEvents.find(ev => ev.id === id);
    if (e) {
      document.getElementById('eventId').value = e.id;
      document.getElementById('eventTitle').value = e.title;
      document.getElementById('eventType').value = e.type || 'OTHER';
      document.getElementById('eventStartDate').value = e.startDate.substring(0, 10);
      document.getElementById('eventEndDate').value = e.endDate ? e.endDate.substring(0, 10) : '';
      document.getElementById('eventDescription').value = e.description || '';
      document.getElementById('deleteEventBtn').style.display = '';
      document.getElementById('eventModalTitle').innerHTML = '<i class="bi bi-calendar-event me-1"></i>Edit Event';
    }
  }
  eventModal.show();
}

async function saveEvent() {
  const id = document.getElementById('eventId').value;
  const title = document.getElementById('eventTitle').value.trim();
  const startDate = document.getElementById('eventStartDate').value;
  const errEl = document.getElementById('eventError');
  if (!title || !startDate) {
    errEl.textContent = 'Title and start date are required.';
    errEl.style.display = 'block';
    return;
  }
  const endDate = document.getElementById('eventEndDate').value;
  if (endDate && endDate < startDate) {
    errEl.textContent = 'End date cannot be before start date.';
    errEl.style.display = 'block';
    return;
  }
  const payload = {
    title,
    type: document.getElementById('eventType').value,
    startDate,
    endDate: endDate || null,
    description: document.getElementById('eventDescription').value.trim() || null,
  };
  try {
    const res = await fetch(id ? `/api/events/${id}` : '/api/events', {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(await res.text());
    eventModal.hide();
    await loadEvents();
  } catch (e) {
    errEl.textContent = 'Could not save event: ' + e.message;
    errEl.style.display = 'block';
  }
}

async function deleteEvent() {
  const id = document.getElementById('eventId').value;
  if (!id || !confirm('Delete this event?')) return;
  try {
    const res = await fetch(`/api/events/${id}`, { method: 'DELETE' });
    if (!res.ok) throw new Error(await res.text());
    eventModal.hide();
    await loadEvents();
  } catch (e) {
    alert('Could not delete event: ' + e.message);
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return esc(s).replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
