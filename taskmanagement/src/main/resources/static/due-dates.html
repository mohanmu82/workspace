<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tasks by Due Date</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="theme.css"/>
  <style>
    body { background: #f4f6f9; font-size: 0.875rem; }
    .badge-status-BACKLOG    { background: #495057; }
    .badge-status-TODO       { background: #6c757d; }
    .badge-status-IN_PROGRESS{ background: #0d6efd; }
    .badge-status-REVIEW     { background: #fd7e14; }
    .badge-status-DONE       { background: #198754; }
    .badge-status-BLOCKED    { background: #dc3545; }
    .badge-status-CANCELLED  { background: #adb5bd; color: #000; }
    .badge-priority-LOW      { background: #adb5bd; color: #000; }
    .badge-priority-MEDIUM   { background: #ffc107; color: #000; }
    .badge-priority-HIGH     { background: #fd7e14; }
    .badge-priority-CRITICAL { background: #dc3545; }
    .group-header { background: #e9ecef; padding: 0.4rem 0.75rem; font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .group-header.overdue-header { background: #f8d7da; color: #842029; }
    .group-header.today-header   { background: #fff3cd; color: #664d03; }
    .task-row:hover { cursor: pointer; background: #f0f4ff !important; }
    .overdue { color: #dc3545 !important; font-weight: 600; }
    #noResults { display:none; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-check2-square me-2"></i>Task Manager</a>
  <div class="d-flex gap-2 align-items-center">
    <span class="text-light">By Due Date</span>
    <a href="task-form.html" class="btn btn-success btn-sm"><i class="bi bi-plus-lg me-1"></i>New Task</a>
    <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-table me-1"></i>All Tasks</a>
    <a href="calendar.html" class="btn btn-outline-light btn-sm"><i class="bi bi-calendar3 me-1"></i>By Date</a>
    <a href="projects.html" class="btn btn-outline-light btn-sm"><i class="bi bi-diagram-3 me-1"></i>Projects</a>
    <a href="programmes.html" class="btn btn-outline-light btn-sm"><i class="bi bi-diagram-2 me-1"></i>Programmes</a>
    <a href="phases.html" class="btn btn-outline-light btn-sm"><i class="bi bi-kanban me-1"></i>Phases</a>
    <a href="timeline.html" class="btn btn-outline-light btn-sm"><i class="bi bi-bar-chart-steps me-1"></i>Timeline</a>
    <a href="dependencies.html" class="btn btn-outline-light btn-sm"><i class="bi bi-link-45deg me-1"></i>Dependencies</a>
    <a href="events.html" class="btn btn-outline-light btn-sm"><i class="bi bi-calendar-week me-1"></i>Events</a>
    <a href="admin.html" class="btn btn-outline-light btn-sm"><i class="bi bi-gear me-1"></i>Admin</a>
    <a href="api-docs.html" class="btn btn-outline-light btn-sm"><i class="bi bi-code-slash me-1"></i>API Docs</a>
    <button class="btn btn-outline-light btn-sm" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle dark mode"><i class="bi bi-moon-stars" id="themeIcon"></i></button>
  </div>
</nav>

<div class="container-fluid p-3">

  <div class="d-flex justify-content-between align-items-center mb-2">
    <span id="cardFieldsSlot"></span>
    <div class="form-check mb-0">
      <input class="form-check-input" type="checkbox" id="includeDone" onchange="renderTasks()">
      <label class="form-check-label small" for="includeDone">Include Done / Cancelled</label>
    </div>
  </div>

  <div id="loadingIndicator" class="text-center py-4 text-muted" style="display:none"><div class="spinner-border spinner-border-sm"></div> Loading...</div>
  <div id="noResults" class="text-center py-5 text-muted"><i class="bi bi-inbox fs-1 d-block mb-2"></i>No tasks found</div>

  <div class="table-responsive">
    <table class="table table-sm table-hover table-bordered bg-white mb-0" style="font-size:0.82rem">
      <thead class="table-light sticky-top" id="tableThead"></thead>
      <tbody id="taskTableBody"></tbody>
    </table>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="theme.js"></script>
<script src="tasks-ws.js"></script>
<script src="card-fields.js"></script>
<script>
let allTasks = [];
const today = new Date();
today.setHours(0, 0, 0, 0);

const DUE_DATES_FIELDS = [
  { id: 'status',       label: 'Status',       default: true },
  { id: 'priority',     label: 'Priority',     default: true },
  { id: 'assignee',     label: 'Assignee',     default: true },
  { id: 'project',      label: 'Project',      default: true },
  { id: 'programme',    label: 'Programme',    default: false },
  { id: 'phase',        label: 'Phase',        default: false },
  { id: 'category',     label: 'Category',     default: false },
  { id: 'workingGroup', label: 'Working Grp',  default: false },
  { id: 'assetClass',   label: 'Asset Class',  default: false },
  { id: 'stakeholder',  label: 'Stakeholder',  default: false },
  { id: 'tags',         label: 'Tags',         default: false },
];

function initCardFields() {
  CardFields.onChange('dueDatesPage', () => renderTasks());
  document.getElementById('cardFieldsSlot').innerHTML = CardFields.renderButton('dueDatesPage', DUE_DATES_FIELDS);
}

function visibleFields() {
  return DUE_DATES_FIELDS.filter(f => CardFields.isOn('dueDatesPage', f.id, f.default));
}

function renderThead() {
  const widths = { status: '110px', priority: '90px', assignee: '110px', project: '110px', programme: '110px', phase: '90px', category: '110px', workingGroup: '110px', assetClass: '110px', stakeholder: '110px', tags: '140px' };
  const visFields = visibleFields();
  document.getElementById('tableThead').innerHTML = '<tr>' +
    '<th style="width:105px">Due Date</th>' +
    '<th>Title</th>' +
    visFields.map(f => `<th style="width:${widths[f.id]}">${f.label}</th>`).join('') +
    '<th style="width:70px">Actions</th>' +
    '</tr>';
  return visFields;
}

async function init() {
  initCardFields();
  document.getElementById('loadingIndicator').style.display = 'block';
  try {
    let data;
    try {
      data = await TaskWS.search({ sortBy: 'dueDate', sortDir: 'asc', size: 500 });
    } catch (wsErr) {
      const res = await fetch('/api/tasks?sortBy=dueDate&sortDir=asc&size=500');
      data = await res.json();
    }
    allTasks = data.tasks || [];
    renderTasks();
  } catch (e) {
    console.error(e);
  } finally {
    document.getElementById('loadingIndicator').style.display = 'none';
  }
}

TaskWS.onTaskChanged(() => init());

function bucketFor(t) {
  if (!t.dueDate) return 'No Due Date';
  const due = new Date(t.dueDate);
  due.setHours(0, 0, 0, 0);
  const diffDays = Math.round((due - today) / 86400000);
  if (diffDays < 0) return 'Overdue';
  if (diffDays === 0) return 'Today';
  if (diffDays === 1) return 'Tomorrow';
  if (diffDays <= 7) return 'This Week';
  if (diffDays <= 30) return 'This Month';
  return 'Later';
}

function renderTasks() {
  const includeDone = document.getElementById('includeDone').checked;
  const tasks = allTasks.filter(t => includeDone || (t.status !== 'DONE' && t.status !== 'CANCELLED'));

  const visFields = renderThead();
  const colspan = 3 + visFields.length;

  const buckets = ['Overdue', 'Today', 'Tomorrow', 'This Week', 'This Month', 'Later', 'No Due Date'];
  const grouped = {};
  buckets.forEach(b => grouped[b] = []);
  tasks.forEach(t => grouped[bucketFor(t)].push(t));

  const tbody = document.getElementById('taskTableBody');
  tbody.innerHTML = '';
  buckets.forEach(b => {
    const gtasks = grouped[b];
    if (!gtasks.length) return;
    const headerCls = b === 'Overdue' ? 'overdue-header' : (b === 'Today' ? 'today-header' : '');
    tbody.innerHTML += `<tr><td colspan="${colspan}" class="group-header ${headerCls}">${b} <span class="badge bg-secondary ms-1">${gtasks.length}</span></td></tr>`;
    gtasks.forEach(t => tbody.innerHTML += taskRow(t, visFields));
  });

  document.getElementById('noResults').style.display = tasks.length === 0 ? 'block' : 'none';
}

function fieldCell(t, fieldId) {
  switch (fieldId) {
    case 'status':   return `<td><span class="badge badge-status-${esc(t.status)}">${esc(t.status||'')}</span></td>`;
    case 'priority': return `<td><span class="badge badge-priority-${esc(t.priority)}">${esc(t.priority||'')}</span></td>`;
    case 'assignee': return `<td>${esc(t.assignee||'')}</td>`;
    case 'project':  return `<td>${esc(t.project||'')}</td>`;
    case 'programme':    return `<td>${esc(t.programme||'')}</td>`;
    case 'phase':         return `<td>${esc(t.customField1||'')}</td>`;
    case 'category':      return `<td>${esc(t.category||'')}</td>`;
    case 'workingGroup':  return `<td>${esc(t.workingGroup||'')}</td>`;
    case 'assetClass':    return `<td>${esc(t.assetClass||'')}</td>`;
    case 'stakeholder':   return `<td>${esc(t.stakeholder||'')}</td>`;
    case 'tags':          return `<td>${(t.tags||[]).join(', ')}</td>`;
    default: return '<td></td>';
  }
}

function taskRow(t, visFields) {
  const due = t.dueDate ? new Date(t.dueDate) : null;
  const over = due && due < today && t.status !== 'DONE' && t.status !== 'CANCELLED';
  return `<tr class="task-row" onclick="location.href='task-form.html?id=${t.id}'">
    <td class="${over ? 'overdue' : ''}">${due ? due.toLocaleDateString() : ''}${over ? ' ⚠' : ''}</td>
    <td><strong>${esc(t.title)}</strong></td>
    ${visFields.map(f => fieldCell(t, f.id)).join('')}
    <td onclick="event.stopPropagation()">
      ${(t.status !== 'DONE' && t.status !== 'CANCELLED') ? `<button class="btn btn-xs btn-outline-success" style="padding:1px 6px;font-size:0.75rem" onclick="closeTask(${t.id})" title="Close (mark as Done)"><i class="bi bi-check-lg"></i></button>` : ''}
    </td>
  </tr>`;
}

async function closeTask(id) {
  try {
    const res = await fetch(`/api/tasks/${id}/status`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Changed-By': (window.getMyName && getMyName()) || 'system' },
      body: JSON.stringify({ status: 'DONE' })
    });
    if (!res.ok) throw new Error(await res.text());
    await init();
  } catch (e) {
    console.error(e);
    alert('Could not close task: ' + e.message);
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
