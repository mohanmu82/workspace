<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Programmes</title>
  <script>document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('theme') || 'light');</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="theme.css"/>
  <style>
    body { background: #f4f6f9; font-size: 0.875rem; }
    .badge-status-IN_PROGRESS{ background: #0d6efd; }
    .badge-status-BLOCKED    { background: #dc3545; }
    .badge-prog-PLANNING  { background: #6c757d; }
    .badge-prog-ACTIVE    { background: #0d6efd; }
    .badge-prog-ON_HOLD   { background: #fd7e14; }
    .badge-prog-COMPLETED { background: #198754; }
    .badge-prog-CANCELLED { background: #adb5bd; color:#000; }
    .programme-card { background:#fff; border:1px solid #dee2e6; border-radius:8px; padding:1rem; margin-bottom:1rem; }
    .programme-title { font-weight:700; font-size:1rem; }
    .mini-stat { font-size:0.72rem; color:#6c757d; }
    #noResults { display:none; }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand fw-bold" href="index.html"><i class="bi bi-check2-square me-2"></i>Task Manager</a>
  <div class="d-flex gap-2 align-items-center">
    <a href="index.html" class="btn btn-outline-light btn-sm"><i class="bi bi-list-task me-1"></i>Tasks</a>
    <a href="due-dates.html" class="btn btn-outline-light btn-sm"><i class="bi bi-calendar-event me-1"></i>Due Dates</a>
    <a href="calendar.html" class="btn btn-outline-light btn-sm"><i class="bi bi-calendar3 me-1"></i>By Date</a>
    <a href="projects.html" class="btn btn-outline-light btn-sm"><i class="bi bi-diagram-3 me-1"></i>Projects</a>
    <span class="text-light fw-semibold"><i class="bi bi-diagram-2 me-1"></i>Programmes</span>
    <a href="phases.html" class="btn btn-outline-light btn-sm"><i class="bi bi-kanban me-1"></i>Phases</a>
    <a href="timeline.html" class="btn btn-outline-light btn-sm"><i class="bi bi-bar-chart-steps me-1"></i>Timeline</a>
    <a href="dependencies.html" class="btn btn-outline-light btn-sm"><i class="bi bi-link-45deg me-1"></i>Dependencies</a>
    <a href="events.html" class="btn btn-outline-light btn-sm"><i class="bi bi-calendar-week me-1"></i>Events</a>
    <a href="notes.html" class="btn btn-outline-light btn-sm"><i class="bi bi-sticky me-1"></i>Notes</a>
    <a href="history.html" class="btn btn-outline-light btn-sm"><i class="bi bi-clock-history me-1"></i>History</a>
    <a href="admin.html" class="btn btn-outline-light btn-sm admin-only"><i class="bi bi-gear me-1"></i>Admin</a>
    <a href="api-docs.html" class="btn btn-outline-light btn-sm"><i class="bi bi-code-slash me-1"></i>API Docs</a>
    <span id="userBadge" class="text-light small me-2"></span>
    <button class="btn btn-outline-light btn-sm" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle dark mode"><i class="bi bi-moon-stars" id="themeIcon"></i></button>
  </div>
</nav>

<div class="container-fluid" style="max-width:1200px; padding:1.5rem 1rem;">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h5 class="mb-0">Programmes</h5>
      <small class="text-muted">Track the programmes tasks and projects roll up under.</small>
    </div>
    <button class="btn btn-success btn-sm" onclick="openProgrammeModal()"><i class="bi bi-plus-lg me-1"></i>New Programme</button>
  </div>

  <div id="programmeFilterBar" class="mb-3"></div>

  <div id="loadingIndicator" class="text-center py-4 text-muted" style="display:none"><div class="spinner-border spinner-border-sm"></div> Loading...</div>
  <div id="noResults" class="text-center py-5 text-muted"><i class="bi bi-diagram-2 fs-1 d-block mb-2"></i>No programmes yet — create one to get started</div>

  <div id="programmeList" class="row" style="--bs-gutter-x: 1rem;"></div>

</div>

<!-- Programme create/edit modal -->
<div class="modal fade" id="programmeModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title" id="programmeModalTitle"><i class="bi bi-diagram-2 me-1"></i>New Programme</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="pg-id"/>
        <div class="mb-2">
          <label class="form-label fw-semibold">Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control form-control-sm" id="pg-name"/>
        </div>
        <div class="mb-2">
          <label class="form-label fw-semibold">Description</label>
          <textarea class="form-control form-control-sm" id="pg-description" rows="3"></textarea>
        </div>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Owner</label>
            <input type="text" class="form-control form-control-sm" id="pg-owner"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Status</label>
            <select class="form-select form-select-sm" id="pg-status">
              <option value="PLANNING">Planning</option>
              <option value="ACTIVE">Active</option>
              <option value="ON_HOLD">On Hold</option>
              <option value="COMPLETED">Completed</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
          </div>
        </div>
        <div class="row g-2 mt-1">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Start Date</label>
            <input type="date" class="form-control form-control-sm" id="pg-start"/>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">End Date</label>
            <input type="date" class="form-control form-control-sm" id="pg-end"/>
          </div>
        </div>
      </div>
      <div class="modal-footer py-2">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary btn-sm" onclick="saveProgramme()">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Delete confirm modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header py-2"><h6 class="modal-title">Delete Programme</h6><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="deleteModalBody">Are you sure?</div>
      <div class="modal-footer py-2">
        <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-danger btn-sm" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastEl" class="toast align-items-center border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsg"></div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="auth.js"></script>
<script src="theme.js"></script>
<script src="share.js"></script>
<script src="filter-bar.js"></script>
<script>
let programmes = [];
let allTasks = [];
let toast = null, programmeModal = null, deleteModal = null;
let pendingDeleteId = null;
let filterBar = null;

const PROGRAMME_FILTER_FIELDS = [
  { id: 'name', label: 'Name' }, { id: 'description', label: 'Description' },
  { id: 'owner', label: 'Owner' }, { id: 'status', label: 'Status' },
  { id: 'startDate', label: 'Start Date' }, { id: 'endDate', label: 'End Date' },
];

async function init() {
  toast = new bootstrap.Toast(document.getElementById('toastEl'), { delay: 2500 });
  programmeModal = new bootstrap.Modal(document.getElementById('programmeModal'));
  deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
  filterBar = FilterBar.init({
    containerId: 'programmeFilterBar',
    storageKey: 'programmesFilters',
    fields: () => PROGRAMME_FILTER_FIELDS,
    getItems: () => programmes,
    onChange: () => render(),
  });
  await loadAll();
}

async function loadAll() {
  document.getElementById('loadingIndicator').style.display = 'block';
  try {
    const [progRes, taskRes] = await Promise.all([
      fetch('/api/programmes').then(r => r.json()),
      fetch('/api/tasks?size=1000').then(r => r.json())
    ]);
    programmes = progRes || [];
    allTasks = (taskRes.tasks) || [];
    render();
  } catch (e) {
    console.error(e);
  } finally {
    document.getElementById('loadingIndicator').style.display = 'none';
  }
}

function tasksForProgramme(name) {
  return allTasks.filter(t => (t.programme || '').toLowerCase() === (name || '').toLowerCase());
}

function render() {
  const list = document.getElementById('programmeList');
  const visible = programmes.filter(p => !filterBar || filterBar.matches(p));
  document.getElementById('noResults').style.display = visible.length === 0 ? 'block' : 'none';
  list.innerHTML = visible.map(p => programmeCard(p)).join('');
}

function programmeCard(p) {
  const tasks = tasksForProgramme(p.name);
  const total = tasks.length;
  const done = tasks.filter(t => t.status === 'DONE').length;
  const inProgress = tasks.filter(t => t.status === 'IN_PROGRESS').length;
  const blocked = tasks.filter(t => t.status === 'BLOCKED').length;
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);

  return `
  <div class="col-md-6 col-lg-4">
    <div class="programme-card">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <div class="programme-title">${esc(p.name)}</div>
          <div class="mini-stat">${esc(p.owner || 'Unassigned owner')}${p.startDate || p.endDate ? ' · ' + fmtRange(p.startDate, p.endDate) : ''}</div>
        </div>
        <span class="badge badge-prog-${p.status}">${esc((p.status||'').replace('_',' '))}</span>
      </div>
      ${p.description ? `<div class="text-muted small mt-2">${esc(p.description)}</div>` : ''}

      <div class="mt-3">
        <div class="d-flex justify-content-between mini-stat mb-1">
          <span>${done}/${total} tasks done</span>
          <span>${pct}%</span>
        </div>
        <div class="progress" style="height:8px"><div class="progress-bar bg-success" style="width:${pct}%"></div></div>
      </div>

      <div class="d-flex flex-wrap gap-1 mt-2">
        ${inProgress ? `<span class="badge badge-status-IN_PROGRESS">${inProgress} in progress</span>` : ''}
        ${blocked ? `<span class="badge badge-status-BLOCKED">${blocked} blocked</span>` : ''}
        ${!inProgress && !blocked && total === 0 ? '<span class="mini-stat">No tasks linked yet</span>' : ''}
      </div>

      <div class="d-flex justify-content-end align-items-center mt-3">
        <button class="btn btn-outline-primary btn-sm" onclick="openProgrammeModal(${p.id})" title="Edit"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-outline-danger btn-sm ms-1" onclick="confirmDeleteProgramme(${p.id}, '${escAttr(p.name)}')" title="Delete"><i class="bi bi-trash"></i></button>
      </div>
    </div>
  </div>`;
}

// ── Programme CRUD ───────────────────────────────────────────────────────────
function openProgrammeModal(id) {
  const p = id ? programmes.find(x => x.id === id) : null;
  document.getElementById('programmeModalTitle').innerHTML = `<i class="bi bi-diagram-2 me-1"></i>${p ? 'Edit' : 'New'} Programme`;
  document.getElementById('pg-id').value = p ? p.id : '';
  document.getElementById('pg-name').value = p ? p.name : '';
  document.getElementById('pg-description').value = p ? (p.description||'') : '';
  document.getElementById('pg-owner').value = p ? (p.owner||'') : '';
  document.getElementById('pg-status').value = p ? p.status : 'PLANNING';
  document.getElementById('pg-start').value = p && p.startDate ? p.startDate : '';
  document.getElementById('pg-end').value = p && p.endDate ? p.endDate : '';
  programmeModal.show();
}

async function saveProgramme() {
  const id = document.getElementById('pg-id').value;
  const name = document.getElementById('pg-name').value.trim();
  if (!name) { showToast('Name is required', 'warning'); return; }
  const body = {
    name,
    description: document.getElementById('pg-description').value.trim() || null,
    owner: document.getElementById('pg-owner').value.trim() || null,
    status: document.getElementById('pg-status').value,
    startDate: document.getElementById('pg-start').value || null,
    endDate: document.getElementById('pg-end').value || null,
  };
  try {
    const res = await fetch(id ? `/api/programmes/${id}` : '/api/programmes', {
      method: id ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) { showToast('Error saving programme', 'danger'); return; }
    programmeModal.hide();
    showToast('Programme saved', 'success');
    await loadAll();
  } catch (e) {
    showToast('Error: ' + e.message, 'danger');
  }
}

function confirmDeleteProgramme(id, name) {
  pendingDeleteId = id;
  document.getElementById('deleteModalBody').textContent = `Delete "${name}"? Tasks referencing this programme name are not deleted.`;
  deleteModal.show();
}

document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
  if (!pendingDeleteId) return;
  try {
    await fetch(`/api/programmes/${pendingDeleteId}`, { method: 'DELETE' });
    deleteModal.hide();
    showToast('Deleted', 'secondary');
    pendingDeleteId = null;
    await loadAll();
  } catch (e) {
    showToast('Error: ' + e.message, 'danger');
  }
});

// ── Utilities ─────────────────────────────────────────────────────────────────
function fmtRange(start, end) {
  if (start && end) return `${start} → ${end}`;
  if (start) return `from ${start}`;
  if (end) return `due ${end}`;
  return '';
}

function showToast(msg, type) {
  const el = document.getElementById('toastEl');
  el.className = `toast align-items-center text-bg-${type} border-0`;
  document.getElementById('toastMsg').textContent = msg;
  toast.show();
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s) {
  return esc(s).replace(/'/g, '&#39;');
}

init();
</script>
</body>
</html>
