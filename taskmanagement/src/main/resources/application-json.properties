# JSON file datasource — activate with: spring.profiles.active=json
# Tasks, comments, and history are stored as JSON files under app.json.datasource.directory.
# No database or Flyway required.

spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Directory where JSON files are stored (created automatically on first run)
app.json.datasource.directory=./data/tasks
