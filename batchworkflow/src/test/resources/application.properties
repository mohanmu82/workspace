# Test-only overrides: keep the context-load test independent of this machine.
# The real config points at a keystore outside this repo and pins the actuator
# port, neither of which a test run should depend on.
server.ssl.enabled=false
management.server.port=0

# Background pollers/dispatchers stay off - the test only checks that the
# context wires up.
observe.enabled=false
apm.enabled=false
