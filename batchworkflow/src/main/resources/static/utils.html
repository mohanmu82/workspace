<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utils</title>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31/dist/ag-grid-community.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsonata/jsonata.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #f4f5f7; color: #172b4d; padding: 24px; }
        .nav { margin-bottom: 18px; }
        .nav a { font-size: 13px; color: #0052cc; text-decoration: none; }
        .nav a:hover { text-decoration: underline; }
        h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }

        .panel { background: #fff; border: 1px solid #dfe1e6; border-radius: 6px;
                 padding: 16px; margin-bottom: 14px; }
        .panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase;
                       letter-spacing: .5px; margin-bottom: 12px; color: #5e6c84; }

        .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .form-group label { font-size: 11px; font-weight: 600; color: #5e6c84;
                            text-transform: uppercase; letter-spacing: .4px; }
        .form-group input {
            padding: 7px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px;
            outline: none; background: #fff; font-family: inherit; }
        .form-group input:focus { border-color: #4c9aff; box-shadow: 0 0 0 2px rgba(76,154,255,.25); }
        .form-group textarea {
            padding: 7px 10px; font-size: 13px; border: 1px solid #ccc; border-radius: 4px;
            outline: none; background: #fff; resize: vertical;
            font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
            min-height: 140px; }
        .form-group textarea:focus { border-color: #4c9aff; box-shadow: 0 0 0 2px rgba(76,154,255,.25); }
        .form-group textarea[readonly] { background: #f4f5f7; }

        .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
        button { padding: 8px 18px; font-size: 13px; font-weight: 500; border: none;
                 border-radius: 4px; cursor: pointer; white-space: nowrap; }
        button.primary   { background: #0052cc; color: #fff; }
        button.primary:hover   { background: #0065ff; }
        button.primary:disabled { background: #a5adba; cursor: not-allowed; }
        button.secondary { background: #fff; color: #0052cc; border: 1px solid #0052cc; }
        button.secondary:hover { background: #e9f0ff; }
        button.secondary:disabled { color: #a5adba; border-color: #a5adba; cursor: not-allowed; }
        button.tool-btn  { background: #f4f5f7; color: #172b4d; border: 1px solid #dfe1e6;
                           padding: 6px 12px; font-size: 12px; }
        button.tool-btn:hover { background: #ebecf0; }
        button.danger    { background: #de350b; color: #fff; }
        button.danger:hover { background: #ff5630; }

        .status-bar { font-size: 13px; color: #5e6c84; min-height: 18px; margin-bottom: 10px; }
        .status-bar.error { color: #de350b; background: #ffebe6; border: 1px solid #ff8f73;
                            border-radius: 4px; padding: 8px 12px; }
        .status-bar.ok    { color: #006644; }

        .section-label { font-size: 11px; font-weight: 700; color: #5e6c84; text-transform: uppercase;
                         letter-spacing: .5px; margin-bottom: 6px; }
        .divider { border: none; border-top: 1px solid #dfe1e6; margin: 14px 0; }

        .transform-bar {
            background: #f8f9fa;
            border: 1px solid #e8eaed;
            border-radius: 4px;
            padding: 8px 10px;
            margin-bottom: 14px;
        }
        .transform-bar .toolbar { margin-bottom: 4px; }
        .transform-bar .toolbar:last-child { margin-bottom: 0; }

        #utilGrid { width: 100%; height: 420px; }
        #gridSection { display: none; }

        .ag-cell { cursor: pointer !important; }

        /* Grid toolbar */
        .grid-toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 6px; }
        .grid-toolbar button { padding: 4px 10px; font-size: 12px; font-weight: 500; border-radius: 4px;
            cursor: pointer; background: #f4f5f7; color: #172b4d; border: 1px solid #dfe1e6; }
        .grid-toolbar button:hover { background: #ebecf0; }
        .row-count-bar { font-size: 11px; color: #5e6c84; text-align: right; margin-bottom: 3px; min-height: 14px; }

        /* Column chooser */
        #utilColChooserBar {
            display: none; flex-wrap: wrap; gap: 5px; padding: 6px 10px;
            background: #fff; border: 1px solid #dfe1e6; border-radius: 6px;
            margin-bottom: 6px; align-items: center;
        }
        #utilColChooserBar .chooser-lbl {
            font-size: 11px; font-weight: 700; color: #5e6c84;
            text-transform: uppercase; letter-spacing: .4px; margin-right: 4px; flex-shrink: 0;
        }
        .u-col-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 9px; background: #f4f5f7; border: 1px solid #dfe1e6;
            border-radius: 14px; font-size: 12px; cursor: pointer; user-select: none;
        }
        .u-col-chip:hover { background: #ebecf0; }
        .u-col-chip input[type=checkbox] { cursor: pointer; margin: 0; }
        .u-chip-drag { cursor: grab; font-size: 11px; color: #b3bac5; line-height: 1; flex-shrink: 0; }
        .u-chip-drag:active { cursor: grabbing; }
        .u-chip-drag:hover { color: #5e6c84; }
        .u-col-chip.dragging { opacity: 0.35; border-style: dashed; }
        .u-col-chip.drag-over { border-color: #0052cc; background: #e9f0ff; }
        .u-pie-btn { padding: 0 4px; font-size: 11px; border: 1px solid #ccc; border-radius: 3px;
            cursor: pointer; background: #fff; color: #0052cc; line-height: 1.5; margin-left: 3px; }
        .u-pie-btn:hover { background: #e9f0ff; }

        /* Chart modal */
        .u-chart-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .u-chart-overlay.open { display: flex; }
        .u-chart-box { background: #fff; border-radius: 8px; padding: 20px 24px; width: 480px;
            max-width: 95vw; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
        .u-chart-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .u-chart-hdr h3 { font-size: 16px; font-weight: 600; margin: 0; }
        .u-chart-hdr button { background: none; border: none; font-size: 18px; cursor: pointer;
            color: #5e6c84; padding: 2px 6px; border-radius: 4px; }
        .u-chart-hdr button:hover { background: #f4f5f7; }

        /* Pivot modal */
        .u-pivot-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1100; align-items: flex-start; justify-content: center; padding: 24px 0; overflow-y: auto; }
        .u-pivot-overlay.open { display: flex; }
        .u-pivot-box { background: #fff; border-radius: 8px; width: 96vw; max-width: 1200px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.28); display: flex; flex-direction: column; }
        .u-pivot-hdr { display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; border-bottom: 1px solid #e0e4ea; flex-shrink: 0; }
        .u-pivot-hdr h3 { font-size: 16px; font-weight: 600; margin: 0; }
        .u-pivot-hdr button { background: none; border: none; font-size: 18px; cursor: pointer; color: #5e6c84; padding: 2px 6px; border-radius: 4px; }
        .u-pivot-hdr button:hover { background: #f4f5f7; }
        .u-pivot-body { display: flex; gap: 0; min-height: 0; }
        .u-pivot-cfg { width: 340px; min-width: 260px; border-right: 1px solid #e0e4ea; padding: 14px;
            display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: calc(90vh - 56px); }
        .u-pivot-lbl { font-size: 11px; font-weight: 600; color: #5e6c84; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
        .u-pivot-avail { display: flex; flex-wrap: wrap; gap: 4px; max-height: 110px; overflow-y: auto;
            padding: 5px; background: #f4f5f7; border: 1px solid #dfe1e6; border-radius: 4px; }
        .u-pchip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px;
            border-radius: 12px; font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap; }
        .u-pchip.avail   { background: #e9f0ff; color: #0052cc; border: 1px solid #4c9aff; }
        .u-pchip.avail:hover { background: #d0e4ff; }
        .u-pchip.row-grp { background: #e3fcef; color: #006644; border: 1px solid #57d9a3; }
        .u-pchip.piv-col { background: #fff0b3; color: #7a4600; border: 1px solid #ffab00; }
        .u-pchip.val-col { background: #ffe2dd; color: #bf2600; border: 1px solid #ff7452; }
        .u-pchip .prm { font-size: 14px; line-height: 1; color: inherit; opacity: .7; }
        .u-pchip .prm:hover { opacity: 1; }
        .u-pivot-drop { min-height: 34px; display: flex; flex-wrap: wrap; gap: 4px; padding: 5px;
            background: #f4f5f7; border: 1px dashed #b3bac5; border-radius: 4px; }
        .u-pivot-drop.empty::after { content: attr(data-hint); color: #b3bac5; font-size: 11px; font-style: italic; }
        .u-pivot-ctrl { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
        .u-pivot-ctrl select { flex: 1; padding: 4px 7px; border: 1px solid #dfe1e6; border-radius: 4px; font-size: 12px; }
        .u-pivot-result { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 14px; overflow: hidden; }
        .u-pivot-result-bar { display: flex; gap: 7px; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
        .u-pivot-tbl-wrap { flex: 1; overflow: auto; border: 1px solid #dfe1e6; border-radius: 4px; }
        .u-pivot-tbl { border-collapse: collapse; font-size: 12px; width: 100%; }
        .u-pivot-tbl th { background: #f4f5f7; padding: 4px 9px; text-align: left; border: 1px solid #dfe1e6; white-space: nowrap; position: sticky; top: 0; z-index: 1; }
        .u-pivot-tbl td { padding: 3px 9px; border: 1px solid #dfe1e6; white-space: nowrap; }
        .u-pivot-tbl tr:nth-child(even) td { background: #fafbfc; }
        .u-pivot-chart-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 240px; position: relative; }
        #utilPivotCanvas { max-height: 400px; }
        #copyToast {
            position: fixed; bottom: 24px; right: 24px; z-index: 9999;
            background: #172b4d; color: #fff; padding: 8px 18px;
            border-radius: 6px; font-size: 13px; font-weight: 500;
            opacity: 0; pointer-events: none;
            transition: opacity 0.15s ease;
        }
        #copyToast.show { opacity: 1; }
    </style>
</head>
<body>
<div class="nav"><a href="/">&larr; Batch Runner</a></div>
<h1>Utils</h1>

<div class="panel">
    <div class="panel-title">HTTP Request</div>

    <div style="display:flex;gap:12px;align-items:flex-end">
        <div class="form-group" style="flex:1;margin-bottom:0">
            <label>URL</label>
            <input type="text" id="urlInput" placeholder="https://..." />
        </div>
        <div class="form-group" style="width:120px;margin-bottom:0">
            <label>Timeout (ms)</label>
            <input type="number" id="httpTimeout" value="5000" min="0" step="500" />
        </div>
    </div>
    <div style="height:10px"></div>

    <div class="form-group">
        <label>Request Body / Value</label>
        <textarea id="valueArea" placeholder="Paste request body, XML, JSON, or any value here..."></textarea>
    </div>

    <div class="transform-bar">
        <div class="section-label">Transform Tools</div>
        <div class="toolbar">
            <button class="tool-btn" onclick="xmlValidate('valueArea')">XML Validate</button>
            <button class="tool-btn" onclick="xmlPrettyPrint('valueArea')">XML Pretty Print</button>
            <button class="tool-btn" onclick="jsonValidate('valueArea')">JSON Validate</button>
            <button class="tool-btn" onclick="jsonPrettyPrint('valueArea')">JSON Pretty Print</button>
            <button class="tool-btn" onclick="base64Decode('valueArea')">Base64 Decode</button>
        </div>
        <div class="toolbar">
            <button class="tool-btn" onclick="base64Encode('valueArea')">Base64 Encode</button>
            <button class="tool-btn" onclick="urlDecode('valueArea')">URL Decode</button>
            <button class="tool-btn" onclick="urlEncode('valueArea')">URL Encode</button>
            <button class="tool-btn" onclick="htmlEscapeBtn('valueArea')">HTML Escape</button>
            <button class="tool-btn" onclick="htmlUnescapeBtn('valueArea')">HTML Unescape</button>
            <button class="tool-btn" onclick="xmlToJson('valueArea')">XML to JSON</button>
            <button class="tool-btn" onclick="jsonStringify('valueArea')">JSON Stringify</button>
            <button class="tool-btn" onclick="jsonUnstringify('valueArea')">JSON Unstringify</button>
            <button class="tool-btn" onclick="propsToJson('valueArea')">Props to JSON</button>
            <button class="tool-btn" onclick="loadGridFrom('valueArea')">Load to Grid</button>
        </div>
    </div>

    <div class="toolbar">
        <button class="primary"    onclick="doHttpPost()">HTTP POST</button>
        <button class="secondary"  onclick="doHttpGet()">HTTP GET</button>
        <button class="secondary"  onclick="loadGrid()">Load Grid</button>
        <button class="danger"     onclick="clearAll()" style="margin-left:auto">Clear</button>
    </div>

    <div id="statusBar" class="status-bar"></div>

    <div class="form-group">
        <label>Response</label>
        <textarea id="responseArea" readonly placeholder="Response will appear here..."
                  aria-label="Response output (read-only)"></textarea>
    </div>

    <div class="transform-bar">
        <div class="section-label">Transform Tools</div>
        <div class="toolbar">
            <button class="tool-btn" onclick="xmlValidate('responseArea')">XML Validate</button>
            <button class="tool-btn" onclick="xmlPrettyPrint('responseArea')">XML Pretty Print</button>
            <button class="tool-btn" onclick="jsonValidate('responseArea')">JSON Validate</button>
            <button class="tool-btn" onclick="jsonPrettyPrint('responseArea')">JSON Pretty Print</button>
            <button class="tool-btn" onclick="base64Decode('responseArea')">Base64 Decode</button>
        </div>
        <div class="toolbar">
            <button class="tool-btn" onclick="base64Encode('responseArea')">Base64 Encode</button>
            <button class="tool-btn" onclick="urlDecode('responseArea')">URL Decode</button>
            <button class="tool-btn" onclick="urlEncode('responseArea')">URL Encode</button>
            <button class="tool-btn" onclick="htmlEscapeBtn('responseArea')">HTML Escape</button>
            <button class="tool-btn" onclick="htmlUnescapeBtn('responseArea')">HTML Unescape</button>
            <button class="tool-btn" onclick="xmlToJson('responseArea')">XML to JSON</button>
            <button class="tool-btn" onclick="jsonStringify('responseArea')">JSON Stringify</button>
            <button class="tool-btn" onclick="jsonUnstringify('responseArea')">JSON Unstringify</button>
            <button class="tool-btn" onclick="propsToJson('responseArea')">Props to JSON</button>
            <button class="tool-btn" onclick="loadGridFrom('responseArea')">Load to Grid</button>
        </div>
    </div>

    <hr class="divider">

    <div class="form-group">
        <label>Result</label>
        <textarea id="resultArea" readonly placeholder="Transform result will appear here..."
                  aria-label="Transform result (read-only)" style="min-height:100px"></textarea>
    </div>
    <div class="toolbar">
        <button class="tool-btn" onclick="loadGridFrom('resultArea')">Load to Grid</button>
    </div>
</div>

<div class="panel">
    <div class="panel-title">JSONata Transform</div>

    <div class="form-group">
        <label>JSON Input</label>
        <textarea id="jsonataInput" placeholder="Paste JSON data here, or use the buttons below to copy from Value Area or Response..."></textarea>
    </div>

    <div class="toolbar">
        <button class="tool-btn" onclick="jsonataCopyFromValue()">&#8593; From Value Area</button>
        <button class="tool-btn" onclick="jsonataCopyFromResponse()">&#8593; From Response</button>
    </div>

    <div class="form-group">
        <label>JSONata Expression</label>
        <textarea id="jsonataExpr" placeholder="e.g.  Account.Order.Product.(Price * Quantity)" style="min-height:60px"></textarea>
    </div>

    <div class="toolbar">
        <button class="primary"  onclick="runJsonata()">Apply</button>
        <button class="danger"   onclick="clearJsonata()" style="margin-left:auto">Clear</button>
    </div>

    <div id="jsonataStatus" class="status-bar"></div>

    <div class="form-group">
        <label>Result</label>
        <textarea id="jsonataResult" readonly placeholder="JSONata result will appear here..."></textarea>
    </div>

    <div class="toolbar">
        <button class="tool-btn" onclick="jsonataLoadGrid()">Load Result to Grid</button>
        <button class="tool-btn" onclick="jsonataPrettyPrint()">Pretty Print Result</button>
    </div>
</div>

<div id="gridSection" class="panel">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <div class="panel-title" style="margin-bottom:0">Data Grid</div>
        <button class="tool-btn" onclick="viewAsHtml()">&#128203; View as HTML</button>
        <button class="tool-btn" onclick="document.getElementById('gridSection').style.display='none'" style="margin-left:auto">&#10005; Close</button>
    </div>
    <div class="grid-toolbar">
        <button onclick="utilGrid && utilGrid.autoSizeAllColumns()">Expand Cols</button>
        <button onclick="utilGrid && utilGrid.sizeColumnsToFit()">Fit Cols</button>
        <button onclick="exportCsvUtil()">Export CSV</button>
        <button onclick="openPivotUtil()">&#8644; Pivot</button>
        <button onclick="copyColumnsAsJson(utilGrid)">Copy Cols JSON</button>
    </div>
    <div id="utilColChooserBar"><span class="chooser-lbl">Columns:</span></div>
    <div class="row-count-bar" id="gridRowCount"></div>
    <div id="utilGrid" class="ag-theme-alpine"></div>
</div>

<script>
    let utilGrid = null;
    let _utilGridData = [];
    let _utilGridCols = [];
    let _utilPieChart = null;
    let _utilPivotChart = null;
    let _utilPivotRowGrps = [], _utilPivotCols = [], _utilPivotVals = [];
    let _toastTimer;
    function showCopyToast() {
        const t = document.getElementById('copyToast');
        t.classList.add('show');
        clearTimeout(_toastTimer);
        _toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
    }

    // ── Cell link menu ─────────────────────────────────────────────────────
    let _cellLinkMenuVal = '', _menuJustOpened = false;
    function _showCellMenu(text, ev) {
        _cellLinkMenuVal = text;
        const m = document.getElementById('cellLinkMenu');
        m.style.left = Math.min(ev.clientX, window.innerWidth - 160) + 'px';
        m.style.top  = Math.min(ev.clientY + 6, window.innerHeight - 80) + 'px';
        m.style.display = 'block';
        _menuJustOpened = true;
        setTimeout(() => { _menuJustOpened = false; }, 10);
    }
    function _doCellCopy() {
        document.getElementById('cellLinkMenu').style.display = 'none';
        const text = _cellLinkMenuVal;
        const copy = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showCopyToast(); };
        navigator.clipboard.writeText(text).then(showCopyToast).catch(copy);
    }
    function _doCellOpen() {
        document.getElementById('cellLinkMenu').style.display = 'none';
        window.open(_cellLinkMenuVal, '_blank', 'noopener,noreferrer');
    }
    document.addEventListener('click', () => { if (_menuJustOpened) return; const m = document.getElementById('cellLinkMenu'); if (m) m.style.display = 'none'; });

    function handleCellClicked(params) {
        if (params.value == null) return;
        const text = String(params.value);
        if (/^https?:\/\//i.test(text)) { _showCellMenu(text, params.event); return; }
        const copy = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showCopyToast(); };
        navigator.clipboard.writeText(text).then(showCopyToast).catch(copy);
    }

    function copyColumnsAsJson(gridApi) {
        if (!gridApi) return;
        const cols = (gridApi.getAllGridColumns ? gridApi.getAllGridColumns() : []).filter(c => c.isVisible());
        if (!cols.length) return;
        const fields = cols.map(c => c.getColDef().field || c.getColId());
        const json = JSON.stringify(fields);
        const copy = () => { const ta = document.createElement('textarea'); ta.value = json; ta.style.cssText = 'position:fixed;left:-9999px;top:0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showCopyToast(); };
        navigator.clipboard.writeText(json).then(showCopyToast).catch(copy);
    }

    // ---- HTTP ----

    function getTimeout() {
        const v = parseInt(document.getElementById('httpTimeout').value, 10);
        return (isNaN(v) || v <= 0) ? 0 : v;
    }

    function makeAbortSignal(timeoutMs) {
        if (!timeoutMs) return { signal: undefined, clear: () => {} };
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), timeoutMs);
        return { signal: controller.signal, clear: () => clearTimeout(tid) };
    }

    async function doHttpPost() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) { setStatus('URL is required', 'error'); return; }
        const body = document.getElementById('valueArea').value;
        const { signal, clear } = makeAbortSignal(getTimeout());
        setStatus('Posting…');
        try {
            const res = await fetch(url, {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    body,
                signal
            });
            clear();
            await handleResponse(res);
        } catch (e) {
            clear();
            setStatus(e.name === 'AbortError' ? 'Request timed out' : 'Request failed: ' + e.message, 'error');
        }
    }

    async function doHttpGet() {
        const url = document.getElementById('urlInput').value.trim();
        if (!url) { setStatus('URL is required', 'error'); return; }
        const { signal, clear } = makeAbortSignal(getTimeout());
        setStatus('Getting…');
        try {
            const res = await fetch(url, { signal });
            clear();
            await handleResponse(res);
        } catch (e) {
            clear();
            setStatus(e.name === 'AbortError' ? 'Request timed out' : 'Request failed: ' + e.message, 'error');
        }
    }

    async function handleResponse(res) {
        const text = await res.text();
        document.getElementById('responseArea').value = text;
        if (res.ok) {
            setStatus('HTTP ' + res.status + ' ' + res.statusText, 'ok');
            tryLoadGridFromText(text);
        } else {
            setStatus('HTTP ' + res.status + ' ' + res.statusText, 'error');
        }
    }

    function loadGrid() {
        const text = document.getElementById('responseArea').value.trim()
                  || document.getElementById('valueArea').value.trim();
        if (!text) { setStatus('No data to load', 'error'); return; }
        const loaded = tryLoadGridFromText(text, true);
        if (!loaded) setStatus('No array found in the JSON to load into the grid', 'error');
    }

    function loadGridFrom(sourceId) {
        const text = document.getElementById(sourceId).value.trim();
        if (!text) { setStatus('No data to load', 'error'); return; }
        const loaded = tryLoadGridFromText(text, true);
        if (!loaded) setStatus('No array found in the JSON to load into the grid', 'error');
    }

    function tryLoadGridFromText(text, explicit = false) {
        let parsed;
        try { parsed = JSON.parse(text); } catch (_) { return false; }

        let rows = null;
        if (Array.isArray(parsed)) {
            rows = parsed;
        } else if (parsed && Array.isArray(parsed.data)) {
            rows = parsed.data;
        } else if (parsed && typeof parsed === 'object') {
            const key = Object.keys(parsed).find(k => Array.isArray(parsed[k]));
            if (key) rows = parsed[key];
        }

        if (!rows || rows.length === 0) return false;
        renderGrid(rows);
        return true;
    }

    function renderGrid(rows) {
        const keys = new Set();
        rows.forEach(r => { if (r && typeof r === 'object') Object.keys(r).forEach(k => keys.add(k)); });
        const colNames = [...keys];
        _utilGridData = rows;
        _utilGridCols = colNames;

        const colDefs = colNames.map(k => ({
            field: k,
            headerName: k,
            sortable: true,
            filter: true,
            resizable: true,
            minWidth: 80,
            tooltipValueGetter: p => (p.value !== null && p.value !== undefined) ? String(p.value) : ''
        }));

        document.getElementById('gridSection').style.display = 'block';

        if (utilGrid) { try { utilGrid.destroy(); } catch(e){} utilGrid = null; }
        const el = document.getElementById('utilGrid');
        el.innerHTML = '';
        utilGrid = agGrid.createGrid(el, {
            columnDefs:    colDefs,
            rowData:       rows,
            defaultColDef: { sortable: true, filter: true, resizable: true, minWidth: 80 },
            pagination: true,
            paginationPageSize: 50,
            tooltipShowDelay: 300,
            onCellClicked: handleCellClicked,
            onGridReady: () => {
                document.getElementById('gridRowCount').textContent = rows.length.toLocaleString() + ' row(s)';
                buildColChooserUtil(colNames);
            }
        });
    }

    function buildColChooserUtil(colNames) {
        const bar = document.getElementById('utilColChooserBar');
        bar.innerHTML = '<span class="chooser-lbl">Columns:</span>';
        if (!colNames || !colNames.length) { bar.style.display = 'none'; return; }
        bar.style.display = 'flex';

        let dragSrc = null;

        function applyColOrder() {
            if (!utilGrid) return;
            const order = [...bar.querySelectorAll('.u-col-chip')].map(el => el.dataset.field);
            utilGrid.applyColumnState({ state: order.map(colId => ({ colId })), applyOrder: true });
        }

        colNames.forEach(field => {
            const chip = document.createElement('label');
            chip.className = 'u-col-chip';
            chip.draggable = true;
            chip.dataset.field = field;

            const handle = document.createElement('span');
            handle.className = 'u-chip-drag';
            handle.textContent = '⠿';
            handle.title = 'Drag to reorder';

            const cb = document.createElement('input');
            cb.type = 'checkbox'; cb.checked = true;
            cb.addEventListener('change', () => {
                if (!utilGrid) return;
                utilGrid.setColumnVisible(field, cb.checked);
            });

            const span = document.createElement('span');
            span.textContent = field;

            const pie = document.createElement('button');
            pie.className = 'u-pie-btn'; pie.textContent = '◕'; pie.title = 'Chart: ' + field;
            pie.type = 'button';
            pie.addEventListener('click', e => { e.preventDefault(); openChartUtil(field, field); });

            chip.addEventListener('dragstart', e => {
                dragSrc = chip;
                e.dataTransfer.effectAllowed = 'move';
                setTimeout(() => chip.classList.add('dragging'), 0);
            });
            chip.addEventListener('dragend', () => {
                chip.classList.remove('dragging');
                bar.querySelectorAll('.u-col-chip').forEach(el => el.classList.remove('drag-over'));
                dragSrc = null;
            });
            chip.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                if (dragSrc && dragSrc !== chip) chip.classList.add('drag-over');
            });
            chip.addEventListener('dragleave', () => chip.classList.remove('drag-over'));
            chip.addEventListener('drop', e => {
                e.preventDefault();
                chip.classList.remove('drag-over');
                if (!dragSrc || dragSrc === chip) return;
                const chips = [...bar.querySelectorAll('.u-col-chip')];
                const from = chips.indexOf(dragSrc);
                const to   = chips.indexOf(chip);
                if (from < to) chip.after(dragSrc); else chip.before(dragSrc);
                applyColOrder();
            });

            chip.appendChild(handle);
            chip.appendChild(cb);
            chip.appendChild(span);
            chip.appendChild(pie);
            bar.appendChild(chip);
        });
    }

    function renderPivotDropzonesUtil() {
        const renderZone = (zoneId, arr, cls) => {
            const zone = document.getElementById(zoneId);
            zone.innerHTML = '';
            if (!arr.length) { zone.classList.add('empty'); return; }
            zone.classList.remove('empty');
            arr.forEach((f, i) => {
                const chip = document.createElement('span');
                chip.className = 'u-pchip ' + cls; chip.textContent = f;
                const rm = document.createElement('span'); rm.className = 'prm'; rm.textContent = '×';
                rm.addEventListener('click', () => { arr.splice(i, 1); renderPivotDropzonesUtil(); });
                chip.appendChild(rm); zone.appendChild(chip);
            });
        };
        renderZone('utilPivotRowGrps', _utilPivotRowGrps, 'row-grp');
        renderZone('utilPivotColsZone', _utilPivotCols, 'piv-col');
        renderZone('utilPivotVals', _utilPivotVals, 'val-col');
    }
    function applyPivotUtil() {
        if (!_utilPivotRowGrps.length) { alert('Add at least one Row Group to pivot.'); return; }
        const displayType = document.getElementById('utilPivotDisplay').value;
        const grouped = {};
        _utilGridData.forEach(row => {
            const key = _utilPivotRowGrps.map(f => row[f] ?? '').join(' | ');
            if (!grouped[key]) grouped[key] = [];
            grouped[key].push(row);
        });
        const valueFields = _utilPivotVals.length ? _utilPivotVals : (_utilGridCols.filter(f => !_utilPivotRowGrps.includes(f)).slice(0, 1));
        const rows = Object.entries(grouped).map(([key, recs]) => {
            const out = {};
            _utilPivotRowGrps.forEach((f, i) => { out[f] = key.split(' | ')[i]; });
            valueFields.forEach(f => {
                const nums = recs.map(r => parseFloat(r[f])).filter(n => !isNaN(n));
                out[f + '_count'] = recs.length;
                if (nums.length) { out[f + '_sum'] = nums.reduce((a,b) => a+b, 0); out[f + '_avg'] = (out[f + '_sum'] / nums.length).toFixed(2); }
            });
            return out;
        });

        document.getElementById('utilPivotEmpty').style.display = 'none';

        if (displayType === 'table') {
            if (!rows.length) return;
            const hdrs = Object.keys(rows[0]);
            const tbl = '<table class="u-pivot-tbl"><thead><tr>' + hdrs.map(h => `<th>${escU(h)}</th>`).join('') + '</tr></thead><tbody>'
                + rows.map(r => '<tr>' + hdrs.map(h => `<td>${escU(String(r[h] ?? ''))}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
            document.getElementById('utilPivotTblWrap').innerHTML = tbl;
            document.getElementById('utilPivotTblWrap').style.display = '';
            document.getElementById('utilPivotChartWrap').style.display = 'none';
            document.getElementById('utilPivotExportBtn').style.display = '';
        } else {
            document.getElementById('utilPivotTblWrap').style.display = 'none';
            document.getElementById('utilPivotChartWrap').style.display = '';
            document.getElementById('utilPivotExportBtn').style.display = 'none';
            const labels = rows.map(r => _utilPivotRowGrps.map(f => r[f]).join(' | '));
            const vField = valueFields[0];
            const values = rows.map(r => r[vField + '_count'] || 0);
            if (_utilPivotChart) { _utilPivotChart.destroy(); _utilPivotChart = null; }
            const ctx = document.getElementById('utilPivotCanvas').getContext('2d');
            const typeMap = { bar:'bar', line:'line', horizontalBar:'bar', pie:'pie' };
            const chartType = typeMap[displayType] || 'bar';
            const isHoriz = displayType === 'horizontalBar';
            _utilPivotChart = new Chart(ctx, {
                type: chartType,
                data: { labels, datasets: [{ label: vField + ' count', data: values,
                    backgroundColor: '#4c9aff', borderColor: '#0052cc', borderWidth: 1 }] },
                options: { indexAxis: isHoriz ? 'y' : 'x', plugins: { legend: { display: false } }, maintainAspectRatio: false }
            });
        }
        document.getElementById('utilPivotInfo').textContent = rows.length + ' groups';
    }
    function exportPivotCsvUtil() {
        const tbl = document.querySelector('#utilPivotTblWrap .u-pivot-tbl');
        if (!tbl) return;
        const hdrs = [...tbl.querySelectorAll('thead th')].map(th => th.textContent);

    function xmlValidate(sourceId) {
        const src = document.getElementById(sourceId).value.trim();
        if (!src) { setStatus('Nothing to validate', 'error'); return; }
        try {
            const parser = new DOMParser();
            const doc    = parser.parseFromString(src, 'application/xml');
            const err    = doc.querySelector('parsererror');
            if (err) {
                setOutput('XML is INVALID:\n' + err.textContent.trim());
                setStatus('XML is invalid', 'error');
            } else {
                setOutput('XML is valid.');
                setStatus('XML is valid', 'ok');
            }
        } catch (e) {
            setOutput('Error: ' + e.message);
            setStatus('Parse error', 'error');
        }
    }

    function xmlPrettyPrint(sourceId) {
        const src = document.getElementById(sourceId).value.trim();
        if (!src) { setStatus('Nothing to format', 'error'); return; }
        try {
            const parser = new DOMParser();
            const doc    = parser.parseFromString(src, 'application/xml');
            const err    = doc.querySelector('parsererror');
            if (err) { setStatus('Invalid XML — cannot pretty print', 'error'); return; }
            const serial = new XMLSerializer();
            const raw    = serial.serializeToString(doc);
            setOutput(indentXml(raw));
            setStatus('XML formatted', 'ok');
        } catch (e) {
            setStatus('Error: ' + e.message, 'error');
        }
    }

    function indentXml(xml) {
        let formatted = '';
        let indent    = 0;
        const tab     = '    ';
        xml.replace(/>\s*</g, '>\n<').split('\n').forEach(node => {
            if (node.match(/^<\/\w/)) indent = Math.max(0, indent - 1);
            formatted += tab.repeat(indent) + node + '\n';
            if (node.match(/^<\w[^>]*[^/]>.*$/) && !node.match(/<.*>.*<\/.*>/)) indent++;
        });
        return formatted.trim();
    }

    function jsonUnstringify(sourceId) {
        const src = document.getElementById(sourceId).value;
        if (!src) { setStatus('Nothing to unstringify', 'error'); return; }
        try {
            let inner;
            try {
                const parsed = JSON.parse(src);
                inner = typeof parsed === 'string' ? JSON.parse(parsed) : parsed;
            } catch (_) {
                // Input has raw \" escapes without outer quotes — wrap and parse to decode
                const unescaped = JSON.parse('"' + src + '"');
                inner = JSON.parse(unescaped);
            }
            setOutput(JSON.stringify(inner, null, 2));
            setStatus('JSON unstringified', 'ok');
        } catch (e) {
            setStatus('Invalid JSON string: ' + e.message, 'error');
        }
    }

    function propsToJson(sourceId) {
        const src = document.getElementById(sourceId).value.trim();
        if (!src) { setStatus('Nothing to convert', 'error'); return; }
        try {
            const parseRow = line => {
                let s = line.trim();
                if (s.startsWith('{') && s.endsWith('}')) s = s.slice(1, -1).trim();
                const pairs = s.split(/,\s*(?=[^\s=,]+=)/);
                const obj = {};
                for (const pair of pairs) {
                    const eqIdx = pair.indexOf('=');
                    if (eqIdx === -1) continue;
                    const key = pair.slice(0, eqIdx).trim();
                    const val = pair.slice(eqIdx + 1).trim();
                    if (key) obj[key] = val;
                }
                return obj;
            };
            const lines = src.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            const result = lines.length === 1 ? parseRow(lines[0]) : lines.map(parseRow);
            setOutput(JSON.stringify(result, null, 2));
            setStatus('Properties converted to JSON' + (lines.length > 1 ? ' (' + lines.length + ' rows)' : ''), 'ok');
        } catch (e) {
            setStatus('Conversion error: ' + e.message, 'error');
        }
    }

    function xmlToJson(sourceId) {
        const src = document.getElementById(sourceId).value.trim();
        if (!src) { setStatus('Nothing to convert', 'error'); return; }
        try {
            const parser = new DOMParser();
            const doc    = parser.parseFromString(src, 'application/xml');
            const err    = doc.querySelector('parsererror');
            if (err) { setStatus('Invalid XML: ' + err.textContent.trim().split('\n')[0], 'error'); return; }
            setOutput(JSON.stringify(xmlNodeToObj(doc.documentElement), null, 2));
            setStatus('XML converted to JSON', 'ok');
        } catch (e) {
            setStatus('Conversion error: ' + e.message, 'error');
        }
    }

    function xmlNodeToObj(node) {
        const obj = {};
        if (node.attributes && node.attributes.length > 0) {
            obj['@attributes'] = {};
            for (const attr of node.attributes) obj['@attributes'][attr.name] = attr.value;
        }
        for (const child of node.childNodes) {
            if (child.nodeType === Node.TEXT_NODE) {
                const t = child.nodeValue.trim();
                if (t) obj['#text'] = (obj['#text'] ? obj['#text'] + t : t);
            } else if (child.nodeType === Node.ELEMENT_NODE) {
                const key = child.tagName;
                const val = xmlNodeToObj(child);
                if (obj[key] === undefined) {
                    obj[key] = val;
                } else if (Array.isArray(obj[key])) {
                    obj[key].push(val);
                } else {
                    obj[key] = [obj[key], val];
                }
            }
        }
        const keys = Object.keys(obj);
        if (keys.length === 1 && keys[0] === '#text') return obj['#text'];
        return obj;
    }

    // -------------------------------------------------------------------------
    // View as HTML
    // -------------------------------------------------------------------------
    let _lastHtml = '';

    function viewAsHtml() {
        if (!utilGrid) return;
        const cols = utilGrid.getAllGridColumns().filter(c => c.isVisible());
        if (!cols.length) return;
        const headers = cols.map(c => c.getColDef().headerName || c.getColId());
        const fields  = cols.map(c => c.getColDef().field     || c.getColId());
        const rows = [];
        utilGrid.forEachNodeAfterFilter(n => { if (n.data) rows.push(n.data); });
        const mapped = rows.map(r => { const m = {}; headers.forEach((h,i) => { m[h] = r[fields[i]]; }); return m; });
        showHtmlModal(buildHtmlTableStr(headers, mapped));
    }

    function buildHtmlTableStr(headers, rows) {
        const th = 'border:1px solid #ccc;padding:6px 10px;background:#f4f5f7;text-align:left;font-weight:bold;white-space:nowrap;font-family:Arial,sans-serif;font-size:12px;';
        const td = 'border:1px solid #ccc;padding:5px 10px;font-family:Arial,sans-serif;font-size:12px;';
        let html = '<table style="border-collapse:collapse"><thead><tr>';
        headers.forEach(h => { html += `<th style="${th}">${escHtmlStr(h)}</th>`; });
        html += '</tr></thead><tbody>';
        rows.forEach(row => {
            html += '<tr>';
            headers.forEach(h => { html += `<td style="${td}">${escHtmlStr(String(row[h] ?? ''))}</td>`; });
            html += '</tr>';
        });
        html += '</tbody></table>';
        return html;
    }

    function escHtmlStr(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showHtmlModal(html) {
        _lastHtml = html;
        let modal = document.getElementById('htmlCopyModal');
        if (!modal) {
            modal = document.createElement('div');
            modal.id = 'htmlCopyModal';
            modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;display:flex;align-items:center;justify-content:center';
            modal.addEventListener('click', e => { if (e.target === modal) modal.style.display = 'none'; });
            modal.setAttribute('role', 'dialog');
            modal.setAttribute('aria-modal', 'true');
            modal.innerHTML = `
                <div style="background:#fff;border-radius:8px;padding:20px;width:92vw;max-width:1200px;max-height:90vh;display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.3)">
                    <div style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
                        <span style="font-weight:600;font-size:14px">HTML Preview</span>
                        <div style="display:flex;gap:8px;align-items:center">
                            <button id="htmlCopyBtn" style="padding:6px 16px;background:#0052cc;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500" onclick="doCopyHtml()">Copy HTML</button>
                            <button onclick="document.getElementById('htmlCopyModal').style.display='none'" style="background:none;border:none;cursor:pointer;font-size:20px;color:#5e6c84;line-height:1">&times;</button>
                        </div>
                    </div>
                    <div id="htmlPreviewArea" style="flex:1;overflow:auto;border:1px solid #dfe1e6;border-radius:4px;padding:10px;min-height:380px;background:#fff"></div>
                </div>`;
            document.body.appendChild(modal);
        }
        document.getElementById('htmlPreviewArea').innerHTML = html;
        modal.style.display = 'flex';
    }

    // ---- JSONata ----

    async function runJsonata() {
        const inputText = document.getElementById('jsonataInput').value.trim();
        const exprText  = document.getElementById('jsonataExpr').value.trim();
        if (!inputText) { setJsonataStatus('No JSON input provided', 'error'); return; }
        if (!exprText)  { setJsonataStatus('No JSONata expression provided', 'error'); return; }
        let data;
        try {
            data = JSON.parse(inputText);
        } catch (e) {
            setJsonataStatus('Invalid JSON input: ' + e.message, 'error');
            return;
        }
        try {
            const expression = jsonata(exprText);
            const result = await expression.evaluate(data);
            document.getElementById('jsonataResult').value =
                result === undefined ? '(no match)' : JSON.stringify(result, null, 2);
            setJsonataStatus('Expression applied', 'ok');
        } catch (e) {
            document.getElementById('jsonataResult').value = '';
            setJsonataStatus('JSONata error: ' + e.message, 'error');
        }
    }

    function setJsonataStatus(msg, type) {
        const el = document.getElementById('jsonataStatus');
        el.textContent = msg;
        el.className   = 'status-bar' + (type ? ' ' + type : '');
    }

    function clearJsonata() {
        ['jsonataInput', 'jsonataExpr', 'jsonataResult'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('jsonataStatus').textContent = '';
        document.getElementById('jsonataStatus').className   = 'status-bar';
    }

    function jsonataCopyFromValue() {
        document.getElementById('jsonataInput').value = document.getElementById('valueArea').value;
        setJsonataStatus('Copied from Value Area', 'ok');
    }

    function jsonataCopyFromResponse() {
        document.getElementById('jsonataInput').value = document.getElementById('responseArea').value;
        setJsonataStatus('Copied from Response', 'ok');
    }

    function jsonataLoadGrid() {
        const text = document.getElementById('jsonataResult').value.trim();
        if (!text || text === '(no match)') { setJsonataStatus('No result to load', 'error'); return; }
        const loaded = tryLoadGridFromText(text, true);
        if (!loaded) setJsonataStatus('Result does not contain a JSON array for the grid', 'error');
    }

    function jsonataPrettyPrint() {
        const src = document.getElementById('jsonataResult').value.trim();
        if (!src) { setJsonataStatus('Nothing to format', 'error'); return; }
        try {
            document.getElementById('jsonataResult').value = JSON.stringify(JSON.parse(src), null, 2);
            setJsonataStatus('Result formatted', 'ok');
        } catch (e) {
            setJsonataStatus('Invalid JSON: ' + e.message, 'error');
        }
    }

    function doCopyHtml() {
        const btn = document.getElementById('htmlCopyBtn');
        const flash = () => { const orig = btn.textContent; btn.textContent = 'Copied!'; btn.style.background = '#006644'; setTimeout(() => { btn.textContent = orig; btn.style.background = '#0052cc'; }, 1500); };
        const fallback = () => {
            const div = document.createElement('div');
            div.contentEditable = true; div.innerHTML = _lastHtml;
            div.style.cssText = 'position:fixed;left:-9999px;top:0';
            document.body.appendChild(div);
            const sel = window.getSelection(); sel.removeAllRanges();
            const range = document.createRange(); range.selectNodeContents(div);
            sel.addRange(range); document.execCommand('copy');
            sel.removeAllRanges(); document.body.removeChild(div);
            flash();
        };
        try {
            const blob = new Blob([_lastHtml], { type: 'text/html' });
            navigator.clipboard.write([new ClipboardItem({ 'text/html': blob })]).then(flash).catch(fallback);
        } catch (e) { fallback(); }
    }
</script>
<div id="copyToast">Copied!</div>
