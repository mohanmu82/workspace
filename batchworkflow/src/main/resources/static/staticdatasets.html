<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Static Datasets</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    color: #222;
    padding: 28px 28px 48px;
  }
  header { margin-bottom: 22px; }
  header h1 { font-size: 1.3rem; font-weight: 700; }
  header p  { font-size: 0.82rem; color: #666; margin-top: 4px; }
  .back     { font-size: 0.8rem; color: #0078d4; text-decoration: none; }
  .back:hover { text-decoration: underline; }

  .card {
    background: #fff;
    border: 1px solid #dde1e7;
    border-radius: 8px;
    padding: 20px 22px;
    margin-bottom: 20px;
  }
  .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; color: #111; }

  .input-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 4px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-size: 0.72rem; font-weight: 700; color: #666;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .field .hint { font-size: 0.7rem; color: #999; font-weight: 400; text-transform: none; letter-spacing: 0; }
  input[type=text], select {
    padding: 7px 10px; font-size: 0.85rem; border: 1px solid #ccc; border-radius: 4px;
    font-family: inherit; background: #fff;
  }
  input:focus, select:focus { outline: none; border-color: #0078d4; }
  input:disabled { background: #f0f2f5; color: #888; }

  button {
    padding: 7px 18px; font-size: 0.85rem; font-weight: 600; border: none;
    border-radius: 4px; cursor: pointer; background: #0078d4; color: #fff; white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #005fa3; }
  button:disabled { background: #9ec5e8; cursor: not-allowed; }
  button.secondary { background: #6c757d; }
  button.secondary:hover { background: #545b62; }
  button.danger { background: #b02a37; }
  button.danger:hover { background: #8f2029; }
  button.small { padding: 4px 12px; font-size: 0.72rem; }

  .status-msg { font-size: 0.82rem; margin-top: 8px; }
  .status-ok  { color: #0a5c36; }
  .status-err { color: #842029; }

  .mono { font-family: Consolas, monospace; }

  .badge { display: inline-block; padding: 2px 9px; border-radius: 10px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; }
  .badge-file { background: #d3f3e6; color: #0a6b47; }
  .badge-http { background: #cfe2ff; color: #084298; }
  .badge-paste { background: #fde8cf; color: #8a4b0a; }
  .badge-onedrive { background: #dbe7f7; color: #0f4c9c; }
  .badge-json { background: #e6dcfb; color: #4b2a8a; }

  .ds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .empty-msg { font-size: 0.82rem; color: #888; padding: 18px; text-align: center; }

  .search-row { margin-bottom: 14px; }
  .search-row input[type=text] { width: 100%; max-width: 360px; }
  .search-hint { font-size: 0.72rem; color: #999; margin-top: 4px; }
  mark { background: #fff3a3; color: inherit; border-radius: 2px; }

  .ds-card {
    border: 1px solid #dde1e7; border-radius: 8px; padding: 14px 16px; background: #fff;
    display: flex; flex-direction: column; gap: 8px;
  }
  .ds-head { display: flex; align-items: flex-start; gap: 8px; }
  .ds-name { font-size: 0.95rem; font-weight: 700; color: #111; flex: 1; word-break: break-word; }
  .ds-location { font-size: 0.75rem; color: #888; word-break: break-all; }
  .ds-meta { font-size: 0.75rem; color: #666; }
  .ds-error { font-size: 0.75rem; color: #b02a37; word-break: break-word; }
  .ds-jsonata { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.68rem;
    background: #eceff3; color: #444;
  }

  .ds-footer { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .ds-footer button { background: #f0f2f5; color: #444; }
  .ds-footer button:hover { background: #e4e8ef; }
  .ds-footer button.danger { background: #fbdcdc; color: #92251f; }
  .ds-footer button.danger:hover { background: #f6c6c6; }

  .grid-modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .grid-modal {
    background: #fff; width: 92vw; height: 86vh; border-radius: 8px; display: flex;
    flex-direction: column; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  .grid-modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid #dde1e7;
  }
  .grid-modal-title { font-size: 1rem; font-weight: 700; }
  .grid-modal-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .grid-modal-status { font-size: 0.78rem; margin-right: 6px; }
  .grid-modal-status.status-ok  { color: #0a5c36; }
  .grid-modal-status.status-err { color: #842029; }
  .grid-modal-body { flex: 1; overflow: hidden; padding: 14px 18px; display: flex; flex-direction: column; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">&#8592; Home</a>
  <h1>Static Datasets</h1>
  <p>Define named row sets loaded once from a file, HTTP endpoint or OneDrive workbook, or pasted in directly as Excel cells or JSON. Other pages (e.g. the Service Dashboard) can pull their input from a saved dataset instead of manual entry.</p>
</header>

<div class="card">
  <div class="card-title" id="formTitle">Add Dataset</div>
  <div class="input-row">
    <div class="field" style="flex:1;min-width:160px">
      <label>Dataset Name</label>
      <input type="text" id="fName" placeholder="my-services">
    </div>
    <div class="field">
      <label>Source</label>
      <select id="fSource" onchange="onSourceChange()">
        <option value="file">File</option>
        <option value="http">HTTP</option>
        <option value="paste">Paste from Excel</option>
        <option value="json">Paste JSON</option>
        <option value="onedrive">OneDrive Excel</option>
      </select>
    </div>
    <div class="field" id="fLocationField" style="flex:2;min-width:280px">
      <label id="fLocationLabel">File Path</label>
      <input type="text" id="fLocation" placeholder="C:/data/services.csv" style="width:100%">
    </div>
    <div class="field" id="fArrayElementField" style="flex:1;min-width:180px;display:none">
      <label id="fArrayElementLabel">Array Element <span class="hint">(JSONPath)</span></label>
      <input type="text" id="fArrayElement" placeholder="$ or $.data" style="width:100%">
    </div>
    <div class="field">
      <button onclick="saveDataset()" id="saveBtn">Save Dataset</button>
    </div>
    <div class="field">
      <button class="secondary" onclick="cancelEdit()" id="cancelBtn" style="display:none">Cancel</button>
    </div>
  </div>
  <div class="field" id="fPasteField" style="display:none;margin-top:10px">
    <label id="fPasteLabel">Pasted Data <span class="hint">(select cells in Excel, copy, then paste below — first row is the header)</span></label>
    <textarea id="fPasteData" rows="8" placeholder="Paste Excel cells here (Ctrl+V)…" style="width:100%;padding:8px 10px;font-size:0.82rem;border:1px solid #ccc;border-radius:4px;font-family:Consolas,monospace;resize:vertical"></textarea>
  </div>
  <div class="field" id="fJsonataField" style="display:none;margin-top:10px">
    <label>JSONata <span class="hint">(optional — reshapes what Array Element selected into the rows the grid shows; or catalog:&lt;name&gt; from the shared JSONata library)</span></label>
    <textarea id="fJsonata" rows="4" placeholder="$.{ &quot;id&quot;: id, &quot;host&quot;: meta.host, &quot;state&quot;: status.state }" style="width:100%;padding:8px 10px;font-size:0.82rem;border:1px solid #ccc;border-radius:4px;font-family:Consolas,monospace;resize:vertical"></textarea>
  </div>
  <div id="formStatusMsg" class="status-msg"></div>
</div>

<div class="card">
  <div class="card-title" style="display:flex;align-items:center;justify-content:space-between">
    <span>Datasets</span>
    <button class="secondary small" onclick="reloadAll()" id="reloadAllBtn">Reload All</button>
  </div>
  <div class="search-row">
    <input type="text" id="dsSearch" placeholder="Search by dataset name or attribute name (e.g. url)" oninput="renderGrid()">
    <div class="search-hint" id="searchHint"></div>
  </div>
  <div id="dsGrid" class="ds-grid"></div>
</div>

<div class="grid-modal-overlay" id="gridModal">
  <div class="grid-modal" role="dialog" aria-modal="true" aria-labelledby="gridModalTitle" tabindex="-1">
    <div class="grid-modal-head">
      <div class="grid-modal-title" id="gridModalTitle"></div>
      <div class="grid-modal-actions">
        <span class="grid-modal-status" id="gridModalStatus"></span>
        <button class="small" id="gridAnalyzeBtn" onclick="analyzeGrid()" style="display:none"
                title="Pivot and chart the rows currently shown (after search/filters/sort) in a new tab">Analyze</button>
        <button class="small" id="gridSaveAsBtn" onclick="saveGridAsDataset()" style="display:none"
                title="Save the rows currently shown (after search/filters/sort) as a pasted dataset">Save as Dataset…</button>
        <button class="small" id="gridEditBtn" onclick="startGridEdit()" style="display:none">Edit Data</button>
        <button class="small" id="gridSaveEditsBtn" onclick="saveGridEdits()" style="display:none">Save Changes</button>
        <button class="secondary small" id="gridDiscardBtn" onclick="discardGridEdits()" style="display:none">Discard</button>
        <button class="secondary small" id="gridModalCloseBtn" onclick="closeGridModal()">Close</button>
      </div>
    </div>
    <div class="grid-modal-body" id="gridModalBody"></div>
  </div>
</div>

<script src="excelgrid.js"></script>
<script>
  let datasets = [];
  let editingName = null;

  /** Sources whose data is typed into the textarea instead of fetched from a location. */
  function isPasted(source) { return source === 'paste' || source === 'json'; }

  function onSourceChange() {
    const source = document.getElementById('fSource').value;
    const isHttp = source === 'http';
    const isJson = source === 'json';
    const isOneDrive = source === 'onedrive';
    document.getElementById('fLocationLabel').textContent =
        isHttp ? 'HTTP URL' : isOneDrive ? 'OneDrive Path (optionally user@company.com:/path)' : 'File Path';
    document.getElementById('fLocation').placeholder = isHttp
        ? 'http://host:port/services.json'
        : isOneDrive ? '/Reports/services.xlsx' : 'C:/data/services.csv';
    document.getElementById('fArrayElementLabel').innerHTML = isOneDrive
        ? 'Sheet <span class="hint">(blank = first sheet)</span>'
        : 'Array Element <span class="hint">(JSONPath)</span>';
    document.getElementById('fArrayElement').placeholder = isOneDrive ? 'Sheet1' : '$ or $.data';
    // Pasted JSON is not fetched, but still needs the JSONPath that picks its row array.
    document.getElementById('fArrayElementField').style.display = isHttp || isJson || isOneDrive ? 'flex' : 'none';
    document.getElementById('fLocationField').style.display = isPasted(source) ? 'none' : 'flex';
    document.getElementById('fPasteField').style.display = isPasted(source) ? 'flex' : 'none';
    document.getElementById('fPasteLabel').innerHTML = isJson
        ? 'Pasted JSON <span class="hint">(paste the document below — Array Element picks the array of objects to load as rows)</span>'
        : 'Pasted Data <span class="hint">(select cells in Excel, copy, then paste below — first row is the header)</span>';
    document.getElementById('fPasteData').placeholder = isJson
        ? '{ "data": [ { "id": 1, "name": "alpha" } ] }'
        : 'Paste Excel cells here (Ctrl+V)…';
    document.getElementById('fJsonataField').style.display = isHttp || isJson ? 'flex' : 'none';
  }

  /** Sources that run a JSONata over their JSON before it becomes rows. */
  function takesJsonata(source) { return source === 'http' || source === 'json'; }

  function setFormStatus(msg, cls) {
    const el = document.getElementById('formStatusMsg');
    el.textContent = msg;
    el.className = 'status-msg' + (cls ? ' ' + cls : '');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function loadList() {
    try {
      const res = await fetch('/staticdataset');
      datasets = await res.json();
    } catch (e) {
      datasets = [];
      setFormStatus('Failed to load datasets: ' + e.message, 'status-err');
    }
    renderGrid();
  }

  async function saveDataset() {
    const name = document.getElementById('fName').value.trim();
    const source = document.getElementById('fSource').value;
    const pasted = isPasted(source);
    const location = pasted
        ? document.getElementById('fPasteData').value.replace(/\n+$/, '')
        : document.getElementById('fLocation').value.trim();
    const arrayElement = document.getElementById('fArrayElement').value.trim();
    const jsonata = takesJsonata(source) ? document.getElementById('fJsonata').value.trim() : '';

    if (!name) { setFormStatus('Dataset name is required.', 'status-err'); return; }
    if (!/^[\w-]+$/.test(name)) { setFormStatus('Name must contain only letters, digits, _ or -.', 'status-err'); return; }
    if (!location) {
      setFormStatus(pasted ? (source === 'json' ? 'Paste some JSON first.' : 'Paste some rows first.')
          : 'Location is required.', 'status-err');
      return;
    }
    if (source === 'json') {
      // Catch a bad paste here rather than saving a dataset that can only fail to load.
      try { JSON.parse(location); }
      catch (e) { setFormStatus('That is not valid JSON: ' + e.message, 'status-err'); return; }
    }

    const payload = { name, source, location, arrayElement: arrayElement || null, jsonata: jsonata || null };
    const isEdit = editingName !== null;
    const url = isEdit ? '/staticdataset/' + encodeURIComponent(editingName) : '/staticdataset';
    const method = isEdit ? 'PUT' : 'POST';

    try {
      const res = await fetch(url, {
        method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) { setFormStatus(data.error || 'Save failed.', 'status-err'); return; }
      const note = data.error ? (' — ' + data.error) : (' — ' + data.count + ' rows loaded');
      setFormStatus('Saved "' + name + '"' + note, data.error ? 'status-err' : 'status-ok');
      cancelEdit();
      loadList();
    } catch (e) {
      setFormStatus('Save failed: ' + e.message, 'status-err');
    }
  }

  function editDataset(name) {
    const ds = datasets.find(d => d.name === name);
    if (!ds) return;
    editingName = name;
    document.getElementById('formTitle').textContent = 'Edit Dataset: ' + name;
    document.getElementById('fName').value = ds.name;
    document.getElementById('fName').disabled = true;
    document.getElementById('fSource').value = ds.source;
    document.getElementById('fLocation').value = isPasted(ds.source) ? '' : (ds.location || '');
    document.getElementById('fPasteData').value = isPasted(ds.source) ? (ds.location || '') : '';
    document.getElementById('fArrayElement').value = ds.arrayElement || '';
    document.getElementById('fJsonata').value = ds.jsonata || '';
    document.getElementById('cancelBtn').style.display = '';
    onSourceChange();
    setFormStatus('');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    editingName = null;
    document.getElementById('formTitle').textContent = 'Add Dataset';
    document.getElementById('fName').value = '';
    document.getElementById('fName').disabled = false;
    document.getElementById('fSource').value = 'file';
    document.getElementById('fLocation').value = '';
    document.getElementById('fPasteData').value = '';
    document.getElementById('fArrayElement').value = '';
    document.getElementById('fJsonata').value = '';
    document.getElementById('cancelBtn').style.display = 'none';
    onSourceChange();
  }

  async function reloadAll() {
    const btn = document.getElementById('reloadAllBtn');
    btn.disabled = true;
    setFormStatus('Reloading all datasets…');
    try {
      const results = await Promise.all(datasets.map(d =>
        fetch('/staticdataset/' + encodeURIComponent(d.name) + '/reload', { method: 'POST' })
          .then(res => res.ok).catch(() => false)));
      const failCount = results.filter(ok => !ok).length;
      if (failCount === 0) {
        setFormStatus('Reloaded ' + datasets.length + ' dataset(s).', 'status-ok');
      } else {
        setFormStatus((datasets.length - failCount) + ' of ' + datasets.length + ' dataset(s) reloaded, ' + failCount + ' failed.', 'status-err');
      }
    } finally {
      btn.disabled = false;
      loadList();
    }
  }

  async function reloadDataset(name) {
    setFormStatus('Reloading "' + name + '"…');
    try {
      const res = await fetch('/staticdataset/' + encodeURIComponent(name) + '/reload', { method: 'POST' });
      const data = await res.json();
      if (!res.ok) { setFormStatus('Reload of "' + name + '" failed: ' + (data.error || res.status), 'status-err'); loadList(); return; }
      setFormStatus('Reloaded "' + name + '".', 'status-ok');
    } catch (e) {
      setFormStatus('Reload of "' + name + '" failed: ' + e.message, 'status-err');
    }
    loadList();
  }

  async function deleteDataset(name) {
    if (!confirm('Delete static dataset "' + name + '"?')) return;
    try {
      const res = await fetch('/staticdataset/' + encodeURIComponent(name), { method: 'DELETE' });
      if (!res.ok) { setFormStatus('Delete of "' + name + '" failed: ' + res.status, 'status-err'); return; }
      setFormStatus('Deleted "' + name + '".', 'status-ok');
    } catch (e) {
      setFormStatus('Delete of "' + name + '" failed: ' + e.message, 'status-err');
      return;
    }
    if (editingName === name) cancelEdit();
    loadList();
  }

  let lastFocusedEl = null;

  // State of the dataset open in the grid modal.
  let gridName = null;      // dataset name
  let gridSource = null;    // its source ('paste', 'file', ...)
  let gridData = null;      // last /data response ({ attributes, rows })
  let gridApi = null;       // ExcelGrid instance
  let gridEditing = false;  // true while a pasted dataset is in edit mode

  function setGridStatus(msg, cls) {
    const el = document.getElementById('gridModalStatus');
    el.textContent = msg || '';
    el.className = 'grid-modal-status' + (cls ? ' ' + cls : '');
  }

  function updateGridButtons() {
    const loaded = gridData !== null;
    const isPaste = gridSource === 'paste';
    document.getElementById('gridAnalyzeBtn').style.display = loaded ? '' : 'none';
    document.getElementById('gridSaveAsBtn').style.display = loaded && !isPaste ? '' : 'none';
    document.getElementById('gridEditBtn').style.display = loaded && isPaste && !gridEditing ? '' : 'none';
    document.getElementById('gridSaveEditsBtn').style.display = gridEditing ? '' : 'none';
    document.getElementById('gridDiscardBtn').style.display = gridEditing ? '' : 'none';
  }

  function mountGrid(editable) {
    gridEditing = editable;
    document.getElementById('gridModalBody').innerHTML = '<div id="gridMount" style="height:100%"></div>';
    gridApi = ExcelGrid.mount({
      containerId: 'gridMount',
      attributes: gridData.attributes || [],
      rows: gridData.rows || [],
      editable,
      onChange: updateGridButtons
    });
    updateGridButtons();
  }

  async function viewGrid(name) {
    lastFocusedEl = document.activeElement;
    const ds = datasets.find(d => d.name === name);
    gridName = name;
    gridSource = ds ? ds.source : null;
    gridData = null;
    gridApi = null;
    gridEditing = false;
    document.getElementById('gridModalTitle').textContent = name;
    document.getElementById('gridModal').style.display = 'flex';
    document.getElementById('gridModalCloseBtn').focus();
    setGridStatus('');
    updateGridButtons();
    await loadGridData();
  }

  async function loadGridData() {
    const body = document.getElementById('gridModalBody');
    body.innerHTML = '<div class="empty-msg">Loading…</div>';
    gridData = null;
    gridApi = null;
    gridEditing = false;
    updateGridButtons();
    try {
      const res = await fetch('/staticdataset/' + encodeURIComponent(gridName) + '/data');
      const data = await res.json();
      if (!res.ok) { body.innerHTML = '<div class="ds-error">' + escapeHtml(data.error || res.statusText) + '</div>'; return; }
      gridData = data;
      mountGrid(false);
    } catch (e) {
      body.innerHTML = '<div class="ds-error">Failed to load: ' + escapeHtml(e.message) + '</div>';
    }
  }

  // Analyze opens gridanalyzer.html on the rows currently shown, handed over by postMessage once
  // the new tab asks for them — the same handshake apppage.html uses for its grids.
  const analyzerHandoffs = new Map();
  let analyzerCount = 0;

  function analyzeGrid() {
    if (!gridApi) return;
    const token = 'ga-' + (++analyzerCount) + '-' + Date.now();
    const win = window.open('gridanalyzer.html?t=' + encodeURIComponent(token), '_blank');
    if (!win) { setGridStatus('The browser blocked the new tab — allow pop-ups to analyze.', 'status-err'); return; }
    analyzerHandoffs.set(token, {
      title: gridName || 'Dataset',
      columns: gridApi.getData().attributes,
      rows: gridApi.getVisibleRows()
    });
    setTimeout(() => analyzerHandoffs.delete(token), 60000);
  }

  window.addEventListener('message', event => {
    if (event.origin !== location.origin) return;
    const message = event.data;
    if (!message || message.type !== 'grid-analyzer-ready') return;
    const payload = analyzerHandoffs.get(message.token);
    if (!payload) return;
    analyzerHandoffs.delete(message.token);
    event.source.postMessage({ type: 'grid-analyzer-data', token: message.token, payload: payload }, location.origin);
  });

  function closeGridModal() {
    if (gridEditing && gridApi && gridApi.isDirty()
        && !confirm('Discard unsaved changes to "' + gridName + '"?')) return;
    document.getElementById('gridModal').style.display = 'none';
    document.getElementById('gridModalBody').innerHTML = '';
    gridName = gridSource = gridData = gridApi = null;
    gridEditing = false;
    if (lastFocusedEl) { lastFocusedEl.focus(); lastFocusedEl = null; }
  }

  /**
   * Serialises rows to the tab-separated text a pasted dataset stores (header row first).
   * Tabs/line breaks inside values are flattened to spaces so they can't split a cell or row;
   * nested objects (e.g. from HTTP JSON) are written as JSON.
   */
  function toPasteText(attributes, rows) {
    const cell = v => (v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v))
        .replace(/[\t\r\n]+/g, ' ');
    const lines = [attributes.map(cell).join('\t')];
    rows.forEach(r => lines.push(attributes.map(a => cell(r[a])).join('\t')));
    return lines.join('\n');
  }

  /** Creates or overwrites {@code name} as a pasted dataset. Returns the save response, or null if it failed. */
  async function putPasteDataset(name, text, isOverwrite) {
    const payload = { name, source: 'paste', location: text, arrayElement: null };
    const res = await fetch(isOverwrite ? '/staticdataset/' + encodeURIComponent(name) : '/staticdataset', {
      method: isOverwrite ? 'PUT' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok) { setGridStatus(data.error || 'Save failed.', 'status-err'); return null; }
    return data;
  }

  async function saveGridAsDataset() {
    if (!gridApi) return;
    const attributes = gridApi.getData().attributes;
    const rows = gridApi.getVisibleRows();
    if (!attributes.length) { setGridStatus('Nothing to save — the dataset has no columns.', 'status-err'); return; }

    const raw = prompt('Save the ' + rows.length + ' row(s) currently shown as a pasted dataset.\n\nNew dataset name:',
        gridName + '-copy');
    if (raw == null) return;
    const name = raw.trim();
    if (!/^[\w-]+$/.test(name)) { setGridStatus('Name must contain only letters, digits, _ or -.', 'status-err'); return; }

    setGridStatus('Saving…');
    try {
      const check = await fetch('/staticdataset/' + encodeURIComponent(name));
      const exists = check.ok;
      if (exists) {
        const existing = await check.json();
        const msg = 'A dataset named "' + name + '" already exists'
            + ' (' + String(existing.source || '').toUpperCase() + ', ' + (existing.count || 0) + ' rows).\n\n'
            + 'Overwrite it? Its current data will be replaced with these ' + rows.length + ' row(s)'
            + ' and it will become a pasted dataset.';
        if (!confirm(msg)) { setGridStatus(''); return; }
      } else if (check.status !== 404) {
        setGridStatus('Could not check whether "' + name + '" exists (HTTP ' + check.status + ').', 'status-err');
        return;
      }

      const data = await putPasteDataset(name, toPasteText(attributes, rows), exists);
      if (!data) return;
      setGridStatus((exists ? 'Overwrote "' : 'Saved "') + name + '" — ' + data.count + ' rows'
          + (data.error ? ' (' + data.error + ')' : ''), data.error ? 'status-err' : 'status-ok');
      await loadList();
      if (name === gridName) {
        // Overwrote the dataset being viewed — it's a pasted dataset now, so show its new data.
        gridSource = 'paste';
        await loadGridData();
      }
    } catch (e) {
      setGridStatus('Save failed: ' + e.message, 'status-err');
    }
  }

  function startGridEdit() {
    if (!gridData) return;
    setGridStatus('Click a cell to edit. Enter/Tab to move, Esc to cancel a cell.');
    mountGrid(true);
  }

  function discardGridEdits() {
    if (gridApi && gridApi.isDirty() && !confirm('Discard unsaved changes to "' + gridName + '"?')) return;
    setGridStatus('');
    mountGrid(false);
  }

  async function saveGridEdits() {
    if (!gridApi) return;
    // Let a cell that's still being edited commit before reading the data.
    if (document.activeElement && document.activeElement.classList.contains('eg-cell-input')) document.activeElement.blur();
    const { attributes, rows } = gridApi.getData();
    if (!attributes.length) { setGridStatus('Add at least one column before saving.', 'status-err'); return; }

    const btn = document.getElementById('gridSaveEditsBtn');
    btn.disabled = true;
    setGridStatus('Saving…');
    try {
      const data = await putPasteDataset(gridName, toPasteText(attributes, rows), true);
      if (!data) { btn.disabled = false; return; }
      await loadList();
      await loadGridData();
      setGridStatus('Saved "' + gridName + '" — ' + data.count + ' rows' + (data.error ? ' (' + data.error + ')' : ''),
          data.error ? 'status-err' : 'status-ok');
    } catch (e) {
      btn.disabled = false;
      setGridStatus('Save failed: ' + e.message, 'status-err');
    }
  }

  function trapModalFocus(e) {
    if (e.key !== 'Tab') return;
    const modal = document.querySelector('#gridModal .grid-modal');
    const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
    if (focusable.length === 0) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  }

  document.getElementById('dsGrid').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const name = btn.dataset.name;
    switch (btn.dataset.action) {
      case 'view': viewGrid(name); break;
      case 'reload': reloadDataset(name); break;
      case 'edit': editDataset(name); break;
      case 'delete': deleteDataset(name); break;
    }
  });

  document.getElementById('gridModal').addEventListener('click', (e) => {
    if (e.target.id === 'gridModal') closeGridModal();
  });
  document.addEventListener('keydown', (e) => {
    if (document.getElementById('gridModal').style.display !== 'flex') return;
    if (e.key === 'Escape') closeGridModal();
    else trapModalFocus(e);
  });

  function highlight(text, query) {
    const escaped = escapeHtml(text);
    if (!query) return escaped;
    const idx = escaped.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return escaped;
    return escaped.slice(0, idx) + '<mark>' + escaped.slice(idx, idx + query.length) + '</mark>' + escaped.slice(idx + query.length);
  }

  function matchesSearch(ds, query) {
    if (!query) return true;
    const q = query.toLowerCase();
    if ((ds.name || '').toLowerCase().includes(q)) return true;
    return (ds.attributes || []).some(a => a.toLowerCase().includes(q));
  }

  function renderGrid() {
    const grid = document.getElementById('dsGrid');
    const query = document.getElementById('dsSearch').value.trim();
    const filtered = datasets.filter(ds => matchesSearch(ds, query));

    const hint = document.getElementById('searchHint');
    hint.textContent = query ? (filtered.length + ' of ' + datasets.length + ' dataset(s) match') : '';

    if (datasets.length === 0) {
      grid.innerHTML = '<div class="empty-msg">No static datasets yet — add one above.</div>';
      return;
    }
    if (filtered.length === 0) {
      grid.innerHTML = '<div class="empty-msg">No datasets match "' + escapeHtml(query) + '".</div>';
      return;
    }
    grid.innerHTML = filtered.map(ds => renderCard(ds, query)).join('');
  }

  function renderCard(ds, query) {
    const badgeCls = ds.source === 'http' ? 'badge-http' : ds.source === 'paste' ? 'badge-paste'
        : ds.source === 'json' ? 'badge-json' : ds.source === 'onedrive' ? 'badge-onedrive' : 'badge-file';
    const badgeText = ds.source === 'paste' ? 'PASTED' : ds.source.toUpperCase();
    const chips = (ds.attributes || []).map(a =>
      '<span class="chip">' + highlight(a, query) + '</span>').join('');
    const metaParts = [];
    if (ds.count != null) metaParts.push(ds.count + ' rows');
    if (ds.loadedTime) metaParts.push('loaded ' + ds.loadedTime);
    const errorHtml = ds.error ? '<div class="ds-error">' + escapeHtml(ds.error) + '</div>' : '';
    const locationHtml = isPasted(ds.source)
        ? '<div class="ds-location">' + (ds.source === 'json' ? 'pasted JSON' : 'pasted data')
            + ' (' + (ds.location ? ds.location.split('\n').length : 0) + ' line(s))</div>'
        : '<div class="ds-location" title="' + escapeHtml(ds.location) + '">' + escapeHtml(ds.location) + '</div>';

    return (
      '<div class="ds-card">' +
        '<div class="ds-head">' +
          '<div class="ds-name">' + highlight(ds.name, query) + '</div>' +
          '<span class="badge ' + badgeCls + '">' + badgeText + '</span>' +
        '</div>' +
        locationHtml +
        ((ds.source === 'http' || ds.source === 'json') && ds.arrayElement ? '<div class="ds-meta mono">arrayElement: ' + escapeHtml(ds.arrayElement) + '</div>' : '') +
        (ds.source === 'onedrive' && ds.arrayElement ? '<div class="ds-meta mono">sheet: ' + escapeHtml(ds.arrayElement) + '</div>' : '') +
        (takesJsonata(ds.source) && ds.jsonata
            ? '<div class="ds-meta mono ds-jsonata" title="' + escapeHtml(ds.jsonata) + '">jsonata: ' + escapeHtml(ds.jsonata) + '</div>'
            : '') +
        '<div class="chip-row">' + chips + '</div>' +
        '<div class="ds-meta">' + metaParts.join(' · ') + '</div>' +
        errorHtml +
        '<div class="ds-footer">' +
          '<button class="small" data-action="view" data-name="' + escapeHtml(ds.name) + '">View Grid</button>' +
          '<button class="small" data-action="reload" data-name="' + escapeHtml(ds.name) + '">Reload</button>' +
          '<button class="small" data-action="edit" data-name="' + escapeHtml(ds.name) + '">Edit</button>' +
          '<button class="small danger" data-action="delete" data-name="' + escapeHtml(ds.name) + '">Delete</button>' +
        '</div>' +
      '</div>'
    );
  }

  onSourceChange();
  loadList();
</script>
</body>
</html>
