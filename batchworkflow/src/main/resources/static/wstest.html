<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WebSocket Tester</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; color: #222; padding: 24px; }
    h1 { font-size: 1.3rem; font-weight: 600; margin-bottom: 16px; }

    .card {
      background: #fff;
      border: 1px solid #dde1e7;
      border-radius: 6px;
      padding: 16px 20px;
      margin-bottom: 16px;
    }

    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; color: #555; }

    textarea {
      width: 100%;
      height: 140px;
      font-family: monospace;
      font-size: 0.85rem;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
    }

    .controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }

    .controls label { margin: 0; font-weight: normal; color: #444; font-size: 0.82rem; }

    input[type=number] {
      width: 80px;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    button {
      padding: 7px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #0078d4;
      color: #fff;
    }
    button:hover { background: #005fa3; }
    button:disabled { background: #9ec5e8; cursor: not-allowed; }
    button.secondary { background: #6c757d; }
    button.secondary:hover { background: #545b62; }

    #progress { font-size: 0.82rem; color: #555; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.83rem;
    }
    th {
      background: #f0f2f5;
      border: 1px solid #dde1e7;
      padding: 8px 12px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
    }
    td {
      border: 1px solid #dde1e7;
      padding: 7px 12px;
      vertical-align: top;
      word-break: break-all;
    }
    tr:nth-child(even) td { background: #fafbfc; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-connecting { background: #fff3cd; color: #856404; }
    .badge-open       { background: #d1e7dd; color: #0a5c36; }
    .badge-failed     { background: #f8d7da; color: #842029; }
    .badge-timeout    { background: #e2d9f3; color: #4a2d7a; }

    .err { color: #842029; font-size: 0.8rem; }
    .url-cell { font-family: monospace; font-size: 0.8rem; }

    .cert-info { font-size: 0.75rem; line-height: 1.5; }
    .cert-info .ci-row { display: flex; gap: 6px; }
    .cert-info .ci-k   { font-weight: 600; color: #555; white-space: nowrap; min-width: 80px; }
    .cert-info .ci-v   { word-break: break-all; }
    .cert-loading { font-size: 0.75rem; color: #888; }
    .cert-na      { font-size: 0.75rem; color: #aaa; }

    .cert-chain-toggle {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.73rem;
      color: #0078d4;
      cursor: pointer;
      user-select: none;
      border: none;
      background: none;
      padding: 0;
      font-family: inherit;
      font-weight: 600;
    }
    .cert-chain-toggle:hover { text-decoration: underline; }

    .cert-chain-list { display: none; margin-top: 8px; }
    .cert-chain-list.open { display: block; }

    .cert-chain-entry {
      border-left: 2px solid #0078d4;
      padding: 6px 0 6px 10px;
      margin-bottom: 8px;
      font-size: 0.73rem;
      line-height: 1.5;
    }
    .cert-chain-entry:last-child { margin-bottom: 0; }
    .cert-chain-entry .chain-label {
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #0078d4;
      margin-bottom: 3px;
    }
  </style>
</head>
<body>

<h1>WebSocket Connection Tester</h1>

<div class="card">
  <label>WebSocket URLs (one per line)</label>
  <textarea id="urlInput" placeholder="ws://localhost:8080/ws&#10;wss://example.com/socket&#10;wss://api.example.com/feed"></textarea>

  <div class="controls">
    <button id="testBtn" onclick="runTests()">Test Connections</button>
    <button class="secondary" onclick="clearResults()">Clear</button>
    <label>Timeout (ms):
      <input type="number" id="timeout" value="5000" min="500" max="30000" step="500">
    </label>
    <span id="progress"></span>
  </div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <table id="resultTable">
    <thead>
      <tr>
        <th>#</th>
        <th>WebSocket URL</th>
        <th>Status</th>
        <th>Error Message</th>
        <th>Certificate Details</th>
      </tr>
    </thead>
    <tbody id="resultBody"></tbody>
  </table>
</div>

<script>
  let activeConnections = [];

  function runTests() {
    const raw     = document.getElementById('urlInput').value;
    const timeout = parseInt(document.getElementById('timeout').value, 10) || 5000;
    const urls    = raw.split('\n').map(u => u.trim()).filter(u => u.length > 0);

    if (urls.length === 0) { alert('Enter at least one WebSocket URL.'); return; }

    closeAll();
    activeConnections = [];

    const tbody = document.getElementById('resultBody');
    tbody.innerHTML = '';
    document.getElementById('resultCard').style.display = '';
    document.getElementById('testBtn').disabled = true;
    updateProgress(0, urls.length);

    let done = 0;

    urls.forEach((url, idx) => {
      const rowId = 'row-' + idx;
      const isSecure = url.startsWith('wss://');
      tbody.insertAdjacentHTML('beforeend', `
        <tr id="${rowId}">
          <td>${idx + 1}</td>
          <td class="url-cell">${escHtml(url)}</td>
          <td><span class="badge badge-connecting">Connecting…</span></td>
          <td class="err"></td>
          <td id="${rowId}-cert">${isSecure ? '<span class="cert-loading">Loading…</span>' : '<span class="cert-na">n/a (ws://)</span>'}</td>
        </tr>`);

      testOne(url, timeout, (status, errMsg) => {
        setRow(rowId, status, errMsg);
        done++;
        updateProgress(done, urls.length);
        if (done === urls.length) document.getElementById('testBtn').disabled = false;
      });

      if (isSecure) fetchCertInfo(url, rowId + '-cert');
    });
  }

  const WS_CLOSE_CODES = {
    1000: 'Normal closure',
    1001: 'Endpoint going away (server shutting down or browser navigating away)',
    1002: 'Protocol error',
    1003: 'Unsupported data type',
    1005: 'No status code received',
    1006: 'Abnormal closure — server unreachable, refused connection, wrong URL/path, TLS certificate rejected, or CORS blocked',
    1007: 'Invalid frame payload (encoding error)',
    1008: 'Policy violation',
    1009: 'Message too large',
    1010: 'Missing extension negotiation',
    1011: 'Internal server error',
    1012: 'Service restart',
    1013: 'Try again later',
    1014: 'Bad gateway',
    1015: 'TLS handshake failure',
  };

  function testOne(url, timeoutMs, cb) {
    let settled = false;
    let lastCloseCode = null;

    function settle(status, errMsg) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      try { ws.close(); } catch (_) {}
      cb(status, errMsg || '');
    }

    let ws;
    try {
      ws = new WebSocket(url);
      activeConnections.push(ws);
    } catch (e) {
      cb('failed', e.message);
      return;
    }

    const timer = setTimeout(() => settle('timeout', 'No response within ' + timeoutMs + ' ms'), timeoutMs);

    ws.addEventListener('open', () => settle('open', ''));

    ws.addEventListener('error', () => {
      // Don't settle yet — let the close event fire next so we capture the close code.
      // If close never fires, the timeout will handle it.
    });

    ws.addEventListener('close', (e) => {
      const code = e.code || 0;
      const decoded = WS_CLOSE_CODES[code];
      let msg = '';
      if (e.reason) {
        msg = e.reason + (decoded ? ' (' + decoded + ')' : '');
      } else if (decoded) {
        msg = 'Code ' + code + ': ' + decoded;
      } else if (code) {
        msg = 'Code ' + code;
      }
      settle('failed', msg || 'Connection closed unexpectedly');
    });
  }

  function setRow(rowId, status, errMsg) {
    const row = document.getElementById(rowId);
    if (!row) return;
    const badgeClass = { open: 'badge-open', failed: 'badge-failed', timeout: 'badge-timeout' }[status] || 'badge-connecting';
    const label      = { open: 'Connected', failed: 'Failed', timeout: 'Timeout' }[status] || status;
    row.cells[2].innerHTML = `<span class="badge ${badgeClass}">${label}</span>`;
    row.cells[3].textContent = errMsg;
  }

  async function fetchCertInfo(wsUrl, cellId) {
    const cell = document.getElementById(cellId);
    if (!cell) return;
    try {
      const inspectUrl = wsUrl.replace('wss://', 'https://').replace('ws://', 'http://');
      const r = await fetch('/certmanager/inspect?url=' + encodeURIComponent(inspectUrl));
      const d = await r.json();
      if (d.error || d.tlsError) {
        cell.innerHTML = `<span class="cert-info" style="color:#842029">${escHtml(d.error || d.tlsError)}</span>`;
        return;
      }
      const certChain = Array.isArray(d.certChain) && d.certChain.length ? d.certChain : null;
      if (!certChain) { cell.innerHTML = '<span class="cert-na">No cert captured</span>'; return; }

      const leaf = certChain[0];
      const fp   = leaf.sha256Fingerprint || '';
      const fpS  = fp.length > 29 ? fp.slice(0, 29) + '…' : fp;

      const chainToggleId = cellId + '-chain';
      const hasChain = certChain.length > 1;

      const chainEntriesHtml = certChain.map((c, i) => {
        const cfp  = c.sha256Fingerprint || '';
        const cfpS = cfp.length > 29 ? cfp.slice(0, 29) + '…' : cfp;
        const labels = ['Leaf (end-entity)', 'Intermediate CA', 'Intermediate CA', 'Root CA'];
        const depthLabel = i === 0 ? labels[0]
          : i === certChain.length - 1 ? labels[3]
          : labels[1];
        return `
          <div class="cert-chain-entry">
            <div class="chain-label">[${i + 1}] ${escHtml(depthLabel)}</div>
            <div class="ci-row"><span class="ci-k">Subject CN</span><span class="ci-v">${escHtml(c.subjectCN || c.subject || '—')}</span></div>
            <div class="ci-row"><span class="ci-k">Issuer CN</span><span class="ci-v">${escHtml(c.issuerCN || c.issuerO || c.issuer || '—')}</span></div>
            <div class="ci-row"><span class="ci-k">Valid From</span><span class="ci-v">${escHtml(c.validFrom || '—')}</span></div>
            <div class="ci-row"><span class="ci-k">Valid To</span><span class="ci-v">${escHtml(c.validTo || '—')}${c.isExpired ? ' <span style="color:#842029;font-weight:700">[EXPIRED]</span>' : ''}</span></div>
            <div class="ci-row"><span class="ci-k">SHA-256</span><span class="ci-v" title="${escHtml(cfp)}" style="font-family:monospace;font-size:0.7rem">${escHtml(cfpS)}</span></div>
          </div>`;
      }).join('');

      cell.innerHTML = `
        <div class="cert-info">
          <div class="ci-row"><span class="ci-k">Subject CN</span><span class="ci-v">${escHtml(leaf.subjectCN || leaf.subject || '—')}</span></div>
          <div class="ci-row"><span class="ci-k">Issuer</span><span class="ci-v">${escHtml(leaf.issuerCN || leaf.issuerO || leaf.issuer || '—')}</span></div>
          <div class="ci-row"><span class="ci-k">Valid To</span><span class="ci-v">${escHtml(leaf.validTo || '—')}${leaf.isExpired ? ' <span style="color:#842029;font-weight:700">[EXPIRED]</span>' : ''}</span></div>
          <div class="ci-row"><span class="ci-k">Server IP</span><span class="ci-v">${escHtml(d.remoteIp || d.resolvedIp || '—')}</span></div>
          <div class="ci-row"><span class="ci-k">Remote Port</span><span class="ci-v">${escHtml(String(d.remotePort || d.port || '—'))}</span></div>
          <div class="ci-row"><span class="ci-k">SHA-256</span><span class="ci-v" title="${escHtml(fp)}" style="font-family:monospace;font-size:0.7rem">${escHtml(fpS)}</span></div>
          ${hasChain ? `<button class="cert-chain-toggle" onclick="toggleChain('${chainToggleId}', this)">&#9654; Show full chain (${certChain.length} certs)</button>` : ''}
        </div>
        ${hasChain ? `<div class="cert-chain-list" id="${chainToggleId}">${chainEntriesHtml}</div>` : ''}`;
    } catch (e) {
      if (cell) cell.innerHTML = `<span class="cert-info" style="color:#842029">${escHtml(e.message)}</span>`;
    }
  }

  function toggleChain(listId, btn) {
    const list = document.getElementById(listId);
    if (!list) return;
    const open = list.classList.toggle('open');
    if (open) {
      btn.dataset.collapsed = btn.textContent;
      btn.textContent = '▼ Hide chain';
    } else {
      btn.textContent = btn.dataset.collapsed || '► Show full chain';
    }
  }

  function updateProgress(done, total) {
    document.getElementById('progress').textContent =
      done < total ? `Testing ${done} / ${total}…` : `Done — ${total} URL${total !== 1 ? 's' : ''} tested.`;
  }

  function clearResults() {
    closeAll();
    document.getElementById('resultBody').innerHTML = '';
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('progress').textContent = '';
    document.getElementById('testBtn').disabled = false;
  }

  function closeAll() {
    activeConnections.forEach(ws => { try { ws.close(); } catch (_) {} });
    activeConnections = [];
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
</script>
</body>
</html>
