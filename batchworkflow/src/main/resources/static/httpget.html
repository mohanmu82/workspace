<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTP Get</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #172b4d;
            padding: 24px;
        }

        .nav { margin-bottom: 18px; }
        .nav a { font-size: 13px; color: #0052cc; text-decoration: none; }
        .nav a:hover { text-decoration: underline; }

        h1 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }

        .panel {
            background: #fff;
            border: 1px solid #dfe1e6;
            border-radius: 6px;
            padding: 16px;
            margin-bottom: 14px;
        }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            color: #5e6c84;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group.wide { grid-column: 1 / -1; }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            color: #5e6c84;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 7px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            background: #fff;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #4c9aff;
            box-shadow: 0 0 0 2px rgba(76,154,255,0.25);
        }

        .form-group textarea {
            resize: vertical;
            font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
            font-size: 13px;
        }

        textarea.headers-area { min-height: 80px; }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-bottom: 14px;
        }

        button {
            padding: 8px 18px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        button.primary { background: #0052cc; color: #fff; }
        button.primary:hover { background: #0065ff; }
        button.primary:disabled { background: #a5adba; cursor: not-allowed; }

        button.secondary {
            background: #fff;
            color: #0052cc;
            border: 1px solid #0052cc;
        }
        button.secondary:hover { background: #e9f0ff; }
        button.secondary:disabled { background: #fff; color: #a5adba; border-color: #a5adba; cursor: not-allowed; }

        .status-bar {
            font-size: 13px;
            color: #5e6c84;
            margin-bottom: 10px;
            min-height: 18px;
        }
        .status-bar.error { color: #de350b; }
        .status-bar.ok    { color: #006644; }

        .response-section { margin-top: 6px; }

        .response-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            user-select: none;
            padding: 10px 14px;
            background: #f4f5f7;
            border: 1px solid #dfe1e6;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
        }
        .response-toggle:hover { background: #ebecf0; }

        .response-toggle .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
        .badge.ok  { background: #e3fcef; color: #006644; }
        .badge.err { background: #ffebe6; color: #de350b; }

        .response-body {
            display: none;
            background: #1e1e2e;
            color: #cdd6f4;
            font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
            font-size: 12px;
            border: 1px solid #2d2d3f;
            border-top: none;
            border-radius: 0 0 4px 4px;
            padding: 12px 14px;
            max-height: 500px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .response-body.open { display: block; }

        .chevron { transition: transform 0.15s; display: inline-block; }
        .chevron.open { transform: rotate(90deg); }

        .auth-fields { display: none; }
        .auth-fields.visible { display: contents; }

        .hint { font-size: 11px; color: #a5adba; margin-top: 2px; }

        .request-preview-header {
            display: none;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .request-preview-label {
            font-size: 11px; font-weight: 600; color: #5e6c84;
            text-transform: uppercase; letter-spacing: 0.4px; flex: 1;
        }
        .request-preview-actions { display: flex; gap: 6px; }
        .request-preview-actions button {
            padding: 3px 10px; font-size: 12px; font-weight: 500; border-radius: 4px;
            cursor: pointer; border: 1px solid #0052cc; background: #fff; color: #0052cc;
        }
        .request-preview-actions button:hover { background: #e9f0ff; }

        .request-preview {
            display: none;
            width: 100%;
            background: #1e1e2e;
            color: #cdd6f4;
            font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
            font-size: 12px;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 12px;
            border: 1px solid #2d2d3f;
            border-left: 3px solid #4c9aff;
            min-height: 80px;
            max-height: 300px;
            resize: vertical;
            overflow: auto;
            outline: none;
        }
    </style>
</head>
<body>

<div class="nav"><a href="/">&larr; Home</a></div>
<h1>HTTP Get</h1>

<!-- URL + Timeout -->
<div class="panel">
    <div class="panel-title">Request</div>
    <div class="form-row">
        <div class="form-group wide">
            <label>URL</label>
            <input id="url" type="text" placeholder="https://api.example.com/endpoint" />
        </div>
        <div class="form-group">
            <label>Timeout (ms)</label>
            <input id="timeoutMs" type="number" value="30000" min="500" step="500" />
        </div>
        <div class="form-group">
            <label>Response Processor</label>
            <select id="responseProcessor" style="width:100%;padding:5px 6px;border:1px solid #ccc;border-radius:3px;font-size:13px;">
                <option value="">(none)</option>
            </select>
        </div>
    </div>

    <!-- Extra headers -->
    <div class="form-group wide" style="margin-bottom:12px">
        <label>Headers (JSON object)</label>
        <textarea id="headers" class="headers-area" spellcheck="false" placeholder='{"Accept": "application/json", "X-Custom": "value"}'></textarea>
        <span class="hint">Merged on top of operation activity headers — these take precedence.</span>
    </div>

    <!-- JSONata transform -->
    <div class="form-group wide">
        <label>JSONata Transform <span style="font-weight:400;text-transform:none;font-size:11px;color:#5e6c84">(optional — applied to response before returning)</span></label>
        <textarea id="jsonataTransform" class="headers-area" spellcheck="false" placeholder='$.data[status = "ACTIVE"]   or leave blank for no transform'></textarea>
        <span class="hint">Inline JSONata expression. To use a file instead, set <code style="font-size:10px">jsonataTransform.key</code> in Extra Request Properties.</span>
    </div>
</div>

<!-- Auth -->
<div class="panel">
    <div class="panel-title">Authentication</div>
    <div class="form-row">
        <div class="form-group">
            <label>Method</label>
            <select id="authMethod" onchange="onAuthMethodChange()">
                <option value="NONE">NONE</option>
                <option value="BASIC">BASIC</option>
                <option value="JWT">JWT</option>
                <option value="DIGEST">DIGEST</option>
                <option value="NTLM">NTLM</option>
                <option value="KERBEROS">KERBEROS</option>
            </select>
        </div>

        <!-- BASIC -->
        <div class="form-group auth-fields" id="authBasicUser">
            <label>Username</label>
            <input id="basicUsername" type="text" autocomplete="off" />
        </div>
        <div class="form-group auth-fields" id="authBasicPass">
            <label>Password</label>
            <input id="basicPassword" type="password" autocomplete="off" />
        </div>

        <!-- JWT -->
        <div class="form-group auth-fields wide" id="authJwtUrl">
            <label>JWT Token URL</label>
            <input id="jwtUrl" type="text" placeholder="https://auth.example.com/token" />
        </div>
        <div class="form-group auth-fields" id="authJwtUser">
            <label>Username</label>
            <input id="jwtUsername" type="text" autocomplete="off" />
        </div>
        <div class="form-group auth-fields" id="authJwtPass">
            <label>Password</label>
            <input id="jwtPassword" type="password" autocomplete="off" />
        </div>
        <div class="form-group auth-fields" id="authJwtApp">
            <label>Application Name (optional)</label>
            <input id="jwtAppName" type="text" />
        </div>

        <!-- DIGEST -->
        <div class="form-group auth-fields" id="authDigestUser">
            <label>Username</label>
            <input id="digestUsername" type="text" autocomplete="off" />
        </div>
        <div class="form-group auth-fields" id="authDigestPass">
            <label>Password</label>
            <input id="digestPassword" type="password" autocomplete="off" />
        </div>

        <!-- NTLM -->
        <div class="form-group auth-fields" id="authNtlmUser">
            <label>Username</label>
            <input id="ntlmUsername" type="text" autocomplete="off" />
        </div>
        <div class="form-group auth-fields" id="authNtlmPass">
            <label>Password</label>
            <input id="ntlmPassword" type="password" autocomplete="off" />
        </div>

        <!-- KERBEROS -->
        <div class="form-group auth-fields" id="authKerbUser">
            <label>Username</label>
            <input id="kerbUsername" type="text" autocomplete="off" />
        </div>
        <div class="form-group auth-fields" id="authKerbKeytab">
            <label>Keytab Path</label>
            <input id="kerbKeytab" type="text" placeholder="/etc/krb5.keytab" />
        </div>
        <div class="form-group auth-fields" id="authKerbSp">
            <label>Service Principal</label>
            <input id="kerbServicePrincipal" type="text" placeholder="HTTP/host@REALM" />
        </div>
    </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
    <button class="primary" id="getBtn" onclick="doGet()">GET</button>
    <span style="margin-left:auto;display:flex;align-items:center;gap:6px;">
        <input id="runTemplateId" type="text" placeholder="template ID"
               style="padding:4px 8px;border:1px solid #ccc;border-radius:3px;font-size:13px;width:130px;" />
        <button class="secondary" onclick="runTemplate()">Run Template</button>
        <input id="templateName" type="text" placeholder="template name"
               style="padding:4px 8px;border:1px solid #ccc;border-radius:3px;font-size:13px;width:130px;" />
        <button class="secondary" onclick="saveTemplate()">Save Template</button>
    </span>
</div>

<div class="request-preview-header" id="requestPreviewHeader">
    <span class="request-preview-label">Last Request</span>
    <div class="request-preview-actions">
        <button onclick="sendRawRequest()">Resend</button>
    </div>
</div>
<textarea class="request-preview" id="requestPreview" spellcheck="false"></textarea>

<div id="statusBar" class="status-bar"></div>

<!-- Response -->
<div class="response-section" id="responseSection" style="display:none">
    <div class="response-toggle" onclick="toggleResponse()" role="button" tabindex="0"
         aria-expanded="false" id="responseToggle" onkeydown="if(event.key==='Enter'||event.key===' ')toggleResponse()">
        <span class="chevron" id="chevron">&#9658;</span>
        <span id="responseLabel">Response</span>
        <span class="badge" id="responseBadge"></span>
        <span id="responseTime" style="margin-left:auto;font-size:11px;color:#5e6c84;font-weight:400"></span>
        <button onclick="clearResponse(event)" style="margin-left:10px;padding:1px 8px;font-size:11px;border:1px solid #ccc;border-radius:3px;background:#fff;cursor:pointer;color:#5e6c84;">Clear</button>
    </div>
    <pre class="response-body" id="responseBody"></pre>
</div>

<script>
    const AUTH_GROUPS = {
        BASIC:    ['authBasicUser','authBasicPass'],
        JWT:      ['authJwtUrl','authJwtUser','authJwtPass','authJwtApp'],
        DIGEST:   ['authDigestUser','authDigestPass'],
        NTLM:     ['authNtlmUser','authNtlmPass'],
        KERBEROS: ['authKerbUser','authKerbKeytab','authKerbSp'],
    };

    function onAuthMethodChange() {
        const method = document.getElementById('authMethod').value;
        document.querySelectorAll('.auth-fields').forEach(el => el.classList.remove('visible'));
        (AUTH_GROUPS[method] || []).forEach(id => document.getElementById(id).classList.add('visible'));
    }

    function toggleResponse() {
        const body   = document.getElementById('responseBody');
        const chev   = document.getElementById('chevron');
        const toggle = document.getElementById('responseToggle');
        body.classList.toggle('open');
        chev.classList.toggle('open');
        toggle.setAttribute('aria-expanded', body.classList.contains('open') ? 'true' : 'false');
    }

    function clearResponse(e) {
        e.stopPropagation();
        document.getElementById('responseSection').style.display = 'none';
        document.getElementById('responseBody').textContent = '';
        document.getElementById('responseBody').classList.remove('open');
        document.getElementById('chevron').classList.remove('open');
        document.getElementById('responseBadge').textContent = '';
        document.getElementById('responseTime').textContent = '';
        document.getElementById('responseLabel').textContent = 'Response';
    }

    async function saveTemplate() {
        const name = document.getElementById('templateName').value.trim();
        if (!name) { setStatus('Enter a template name first.', 'error'); return; }
        const lastReq = document.getElementById('requestPreview').value.trim();
        if (!lastReq) { setStatus('No Last Request to save — run a request first.', 'error'); return; }
        let content;
        try { content = JSON.parse(lastReq); }
        catch (e) { setStatus('Last Request is not valid JSON: ' + e.message, 'error'); return; }
        try {
            const res  = await fetch('/batch/template', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, content })
            });
            const data = await res.json();
            if (res.ok) setStatus('Saved: ' + data.path, 'ok');
            else setStatus('Save failed: ' + (data.Errors?.[0]?.message ?? res.statusText), 'error');
        } catch (e) { setStatus('Save failed: ' + e.message, 'error'); }
    }

    async function runTemplate() {
        const id = document.getElementById('runTemplateId').value.trim();
        if (!id) { setStatus('Enter a template ID first.', 'error'); return; }
        setStatus('Running template ' + id + '…');
        const start = Date.now();
        try {
            const res  = await fetch('/batch/template?name=' + encodeURIComponent(id));
            const data = await res.json();
            const elapsed = Date.now() - start;
            showResponse(data, res.status, elapsed);
            if (res.ok) setStatus('Template run complete (' + elapsed + ' ms).', 'ok');
            else setStatus('Template run failed: ' + (data.Errors?.[0]?.message ?? res.statusText), 'error');
        } catch (e) { setStatus('Template run failed: ' + e.message, 'error'); }
    }

    function setStatus(msg, type = '') {
        const bar = document.getElementById('statusBar');
        bar.textContent = msg;
        bar.className = 'status-bar' + (type ? ' ' + type : '');
    }

    async function resolveAuthHeader() {
        const method = document.getElementById('authMethod').value;
        if (method === 'BASIC') {
            const user = document.getElementById('basicUsername').value;
            const pass = document.getElementById('basicPassword').value;
            return 'Basic ' + btoa(user + ':' + pass);
        }
        if (method === 'JWT') {
            const jwtUrl  = document.getElementById('jwtUrl').value.trim();
            const user    = document.getElementById('jwtUsername').value;
            const pass    = document.getElementById('jwtPassword').value;
            const appName = document.getElementById('jwtAppName').value;
            if (!jwtUrl) throw new Error('JWT Token URL is required');
            const payload = { username: user, password: pass };
            if (appName) payload.applicationName = appName;
            const res = await fetch(jwtUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error('JWT token fetch failed: HTTP ' + res.status);
            const data = await res.json();
            const token = data.token || data.access_token || data.accessToken || data.jwt;
            if (!token) throw new Error('JWT response did not contain a token field');
            return 'Bearer ' + token;
        }
        return null; // NONE / DIGEST / NTLM / KERBEROS handled server-side via operation config
    }

    async function doGet() {
        const url     = document.getElementById('url').value.trim();
        const timeout = parseInt(document.getElementById('timeoutMs').value) || 30000;

        if (!url) { setStatus('URL is required.', 'error'); return; }

        // Parse extra headers
        let extraHeaders = {};
        const headersRaw = document.getElementById('headers').value.trim();
        if (headersRaw) {
            try { extraHeaders = JSON.parse(headersRaw); }
            catch (e) { setStatus('Headers are not valid JSON: ' + e.message, 'error'); return; }
        }

        // Resolve auth header
        let authHeader = null;
        try { authHeader = await resolveAuthHeader(); }
        catch (e) { setStatus(e.message, 'error'); return; }
        if (authHeader) extraHeaders['Authorization'] = authHeader;

        // NTLM: validate and pass credentials as request properties
        const authMethod = document.getElementById('authMethod').value;
        let ntlmProps = {};
        if (authMethod === 'NTLM') {
            const ntlmUser = document.getElementById('ntlmUsername').value.trim();
            const ntlmPass = document.getElementById('ntlmPassword').value;
            if (!ntlmUser || !ntlmPass) { setStatus('NTLM requires username and password.', 'error'); return; }
            ntlmProps = { ntlmUsername: ntlmUser, ntlmPassword: ntlmPass };
        }

        const btn = document.getElementById('getBtn');
        btn.disabled = true;
        setStatus('Sending…');

        const responseProcessor = document.getElementById('responseProcessor').value;
        const jsonataValue = document.getElementById('jsonataTransform').value.trim();
        const request = {
            operation:       'httpget',
            inputSource:     'SPECIFIC',
            raw:             [{}],
            inputHttpUrl:    url,
            inputHttpHeader: extraHeaders,
            httpThreadCount: 1,
            httpTimeoutMs:   timeout,
            ...(responseProcessor ? { responseProcessor } : {}),
            ...(jsonataValue ? { jsonataTransform: { value: jsonataValue } } : {}),
            ...ntlmProps
        };

        const requestJson = JSON.stringify(request, null, 2);
        showRequestPreview(requestJson);

        const t0 = Date.now();
        try {
            const res  = await fetch('/batch/run', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    requestJson
            });
            const elapsed = Date.now() - t0;
            const json = await res.json();
            showResponse(json, res.status, elapsed);
        } catch (e) {
            setStatus('Request failed: ' + e.message, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    function showRequestPreview(json) {
        document.getElementById('requestPreview').value = json;
        document.getElementById('requestPreview').style.display = 'block';
        document.getElementById('requestPreviewHeader').style.display = 'flex';
    }

    async function sendRawRequest() {
        const text = document.getElementById('requestPreview').value.trim();
        if (!text) { setStatus('Last request is empty.', 'error'); return; }
        let parsed;
        try { parsed = JSON.parse(text); }
        catch (e) { setStatus('Fix JSON before sending: ' + e.message, 'error'); return; }
        const btn = document.getElementById('getBtn');
        btn.disabled = true;
        setStatus('Sending…');
        const t0 = Date.now();
        try {
            const res = await fetch('/batch/run', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    text
            });
            const elapsed = Date.now() - t0;
            const json = await res.json();
            showResponse(json, res.status, elapsed);
        } catch (e) {
            setStatus('Request failed: ' + e.message, 'error');
        } finally {
            btn.disabled = false;
        }
    }

    function showResponse(json, httpStatus, elapsedMs) {
        const section = document.getElementById('responseSection');
        const label   = document.getElementById('responseLabel');
        const badge   = document.getElementById('responseBadge');
        const timeEl  = document.getElementById('responseTime');
        const bodyEl  = document.getElementById('responseBody');
        const chevron = document.getElementById('chevron');

        const ok = httpStatus >= 200 && httpStatus < 300;
        label.textContent = 'Response — HTTP ' + httpStatus;
        badge.textContent = ok ? 'OK' : 'ERROR';
        badge.className   = 'badge ' + (ok ? 'ok' : 'err');
        timeEl.textContent = elapsedMs + ' ms';

        bodyEl.textContent = JSON.stringify(json, null, 2);
        bodyEl.classList.add('open');
        chevron.classList.add('open');
        section.style.display = '';

        setStatus(ok ? 'Done.' : 'Server returned HTTP ' + httpStatus + '.', ok ? 'ok' : 'error');
    }

    // Load response processor names
    (async () => {
        try {
            const res  = await fetch('/batch/operations');
            const data = await res.json();
            const names = data.responseProcessors || [];
            const sel = document.getElementById('responseProcessor');
            names.forEach(n => {
                const opt = document.createElement('option');
                opt.value = n; opt.textContent = n;
                sel.appendChild(opt);
            });
        } catch (e) { /* silently ignore */ }
    })();
</script>

</body>
</html>
