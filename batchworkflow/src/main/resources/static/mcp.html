<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #172b4d;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #dfe1e6;
            padding: 14px 20px 0;
            flex: none;
        }

        .nav { margin-bottom: 8px; }
        .nav a { font-size: 13px; color: #0052cc; text-decoration: none; }
        .nav a:hover { text-decoration: underline; }

        .title-row { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
        h1 { font-size: 19px; font-weight: 600; }
        .subtitle { font-size: 13px; color: #5e6c84; }

        .tabs { display: flex; gap: 2px; margin-top: 12px; flex-wrap: wrap; }

        .tab {
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 500;
            color: #5e6c84;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .tab:hover { color: #172b4d; background: #f4f5f7; }
        .tab.active { color: #0052cc; border-bottom-color: #0052cc; font-weight: 600; }
        .tab .step { font-size: 10px; font-weight: 700; color: #fff; background: #b3bac5; border-radius: 9px; padding: 1px 6px; }
        .tab.active .step { background: #0052cc; }

        .frame-wrap { flex: 1; min-height: 0; }
        iframe { width: 100%; height: 100%; border: none; display: block; }
    </style>
</head>
<body>

<header>
    <div class="nav"><a href="/">&larr; Batch Workflow</a></div>
    <div class="title-row">
        <h1>MCP</h1>
        <span class="subtitle">Publish page actions as MCP tools, switch them on and off, watch the connections calling them, and call any MCP server.</span>
    </div>
    <div class="tabs" id="tabs"></div>
</header>

<div class="frame-wrap">
    <iframe id="subPage" title="MCP sub-page"></iframe>
</div>

<script>
    // Every MCP page in one place: the tools this server publishes, who is calling them, and the client
    // pages for calling another server. Each is also a standalone page; the shell frames it and keeps
    // the current tab in the URL hash, the same way app.html does.
    const TABS = [
        { id: 'tools',       label: 'MCP Tools',             file: 'appmcp.html' },
        { id: 'connections', label: 'SSE / MCP Connections', file: 'sseconnections.html' },
        { id: 'client',      label: 'MCP Client',            file: 'mcpclient.html' },
        { id: 'regression',  label: 'Tools Regression',      file: 'mcpregression.html' },
        { id: 'connect',     label: 'Connect Claude',        file: 'appmcphelp.html' }
    ];

    function currentTabId() {
        const fromHash = (location.hash || '').replace('#', '');
        return TABS.some(t => t.id === fromHash) ? fromHash : TABS[0].id;
    }

    function renderTabs() {
        const active = currentTabId();
        document.getElementById('tabs').innerHTML = TABS.map(t =>
            '<button class="tab' + (t.id === active ? ' active' : '') + '" onclick="selectTab(\'' + t.id + '\')">' +
                (t.step ? '<span class="step">' + t.step + '</span>' : '') + t.label +
            '</button>'
        ).join('');
    }

    function selectTab(id) {
        if (currentTabId() === id && location.hash) return;
        location.hash = id;
    }

    function showCurrentTab() {
        const tab = TABS.find(t => t.id === currentTabId());
        const frame = document.getElementById('subPage');
        const target = tab.file;
        // Compare against the resolved src so re-selecting the active tab doesn't reload it
        // and throw away whatever the user was in the middle of editing.
        if (!frame.src.endsWith('/' + target)) frame.src = target;
        renderTabs();
    }

    window.addEventListener('hashchange', showCurrentTab);
    showCurrentTab();
</script>

</body>
</html>
