spring.application.name=batch
app.version=@project.version@

server.port=8090

# Jolokia / Actuator on dedicated port 8081
management.server.port=8091
management.endpoints.web.exposure.include=*
management.endpoint.jolokia.access=unrestricted

# Remote agent control channel (/agent/ws) and discovery — shared secret the remoteagent
# jar must present on register/discover; set to a real value in every environment.
agent.token=changeme
agent.multicast.group=230.0.0.5
agent.multicast.port=4446
