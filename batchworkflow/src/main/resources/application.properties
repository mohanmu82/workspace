spring.application.name=batch
app.version=@project.version@

server.port=8090

# -----------------------------------------------------------------------
# HTTPS
#   Reuses the taskmanagement module's self-signed dev certificate (CN=localhost).
#   Replace with a real keystore and set SSL_KEYSTORE_PASSWORD for real deployments -
#   browsers will flag the self-signed cert as untrusted.
# -----------------------------------------------------------------------
server.ssl.enabled=true
server.ssl.key-store=file:C:/work/workspace/taskmanagement/src/main/resources/keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-alias=taskmanagement

# Jolokia / Actuator on dedicated port 8091
management.server.port=8091
management.endpoints.web.exposure.include=*
management.endpoint.jolokia.access=unrestricted

# Push JVM/app metrics to a shared Prometheus Pushgateway — set address to the real
# gateway host:port in every environment.
management.prometheus.metrics.export.pushgateway.enabled=false
management.prometheus.metrics.export.pushgateway.address=localhost:9091
management.prometheus.metrics.export.pushgateway.job=batchworkflow
management.prometheus.metrics.export.pushgateway.push-rate=1m
management.prometheus.metrics.export.pushgateway.shutdown-operation=post

# Remote agent control channel (/agent/ws) and discovery — shared secret the remoteagent
# jar must present on register/discover; set to a real value in every environment.
agent.token=changeme
agent.multicast.group=230.0.0.5
agent.multicast.port=4446

# -----------------------------------------------------------------------
# Authentication / SSO
#   When disabled (default) every page and API call is open - no login redirect,
#   no permission checks. Useful for local dev. Flip to true once jwt-url and
#   jwt-secret are configured for the real IdP.
# -----------------------------------------------------------------------
auth.enabled=false

# Standard URL the browser is redirected to for authentication. Must accept a
# redirect-uri param (name configurable below) and, once the user is authenticated
# via their browser session/credentials, send the browser back to that URL with a
# JWT appended as a query param (name also configurable below).
auth.jwt-url=https://sso.example.com/oauth2/authorize

# Query param this app's own return URL is passed under when redirecting to jwt-url
auth.redirect-param=redirect_uri

# Query param the IdP appends the JWT under when it redirects back to this app
auth.token-param=token

# HMAC-SHA256 secret used to verify the JWT signature - must match the IdP's signing
# secret and be at least 32 characters long.
auth.jwt-secret=change-me-to-a-real-32-plus-character-secret

# Userids (the JWT "sub" claim) granted admin access - can see the Admin > Access tab
# and manage other users' permissions, regardless of their own access-grant record.
auth.admin-userids=
